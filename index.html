<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>The Poker Way</title>
<meta name="description" content="Logic and Intuition Training" />
<meta name="referrer" content="no-referrer" />
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
<meta name="theme-color" content="#000000" />
<meta name="msapplication-navbutton-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="no" />
<meta name="mobile-web-app-capable" content="no" />
<meta name="google" content="notranslate" />
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="manifest" href="manifest.json" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --gold: #ffcb2b;
  --gold-2: #e0a800;
  --text: #e8eef5;
  --muted: #8a8a8a;
  --muted-soft: #9a9a9a;
  --muted-soft-2: #a8a8a8;
  --pro-color: #a01f0e;
  --vip-color: #0e4a85;
  --accent: #3fa9f5;
  --danger: #d94f3d;
  --ok: #2fb571;
  --allin: #e63946;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --board-card-w: clamp(34px, 5.2vmin, 48px);
  --board-card-h: clamp(48px, 7.3vmin, 67px);
  --edge: clamp(6px, 1.1vmin, 10px);
  --pct-block-w: clamp(88px, 13vmin, 110px);
  --dash-inset: clamp(10px, 2vmin, 18px);
  --small-text: clamp(11px, 1.4vmin, 13px);
  --info-row-text: clamp(11px, 1.5vmin, 14px);
  --place-text: clamp(12px, 1.6vmin, 15px);
  --raise-amount-mini-w: clamp(66px, calc(9vmin + 10px), 86px);
  --nav-btn: clamp(28px, 3.8vmin, 34px);
  --nav-icon-size: clamp(18px, 2.6vmin, 20px);
  --nav-gap: clamp(1px, 0.35vmin, 3px);
  --nav-counter-w: clamp(36px, 5.2vmin, 46px);
  --nav-counter-size: clamp(11px, 1.5vmin, 13px);
  --table-radius: clamp(28px, 4vmin, 46px);
  --table-border-w: clamp(8px, 1.4vmin, 14px);
  --hero-timer-size: clamp(40px, 5.6vmin, 52px);
  --hero-timer-left: calc(clamp(8px, 1.2vmin, 10px) + 2px);
  --table-col-w: min(94vw, calc((100vh - clamp(8px, 1.6vmin, 20px)) * 9 / 16));
  --hero-actions-bottom-pad: 0px;
  --nav-counter-lift: 0px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  overflow: hidden;
  overscroll-behavior: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  color-scheme: dark;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -ms-touch-action: manipulation;
  touch-action: manipulation;
}

html {
  background: var(--bg);
  color-scheme: dark;
}

body {
  background: var(--bg);
  color-scheme: dark;
}

button { cursor: pointer; }
button:disabled, button.disabled { cursor: default; }

html, body, #app, #donate-card-box { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar,
#app::-webkit-scrollbar,
#donate-card-box::-webkit-scrollbar {
  width: 0 !important; height: 0 !important; display: none !important; background: transparent !important;
}

#app {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  z-index: 600;
  display: block;
  isolation: isolate;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

#hero-actions.inactive,
#hero-actions.inactive *,
#hero-actions.inactive input,
#quick-percent-list.inactive,
#quick-percent-list.inactive * { cursor: default !important; }

#hero-actions #hand-nav button:not(:disabled) { cursor: pointer !important; }
#hero-actions #hand-nav button:disabled { cursor: default !important; }

#table-scene {
  position: absolute;
  top: calc(var(--safe-top) + 2px);
  left: 0; right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding-bottom: calc(var(--safe-bottom) + 4px);
}

#poker-table-wood {
  position: relative;
  aspect-ratio: 9 / 16;
  height: calc(100% - clamp(8px, 1.6vmin, 20px));
  width: auto;
  max-width: 94vw;
  background: linear-gradient(180deg,
    #6e4a25 0%,
    #67431f 8%,
    #5f3d1c 16%,
    #573619 24%,
    #4f3016 32%,
    #472b13 40%,
    #402611 48%,
    #3a2210 56%,
    #34200e 64%,
    #2f1d0d 72%,
    #2b1b0c 80%,
    #281a0b 88%,
    #26190a 94%,
    #24180a 100%);
  border-radius: var(--table-radius);
  box-shadow:
    0 0 0 3px #1a0f05,
    0 0 60px rgba(0,0,0,.95);
  padding: var(--table-border-w);
  box-sizing: border-box;
}

#poker-table-wood.history-mode {
  background: linear-gradient(180deg,
    #5e5e5e 0%,
    #585858 8%,
    #525252 16%,
    #4c4c4c 24%,
    #464646 32%,
    #414141 40%,
    #3c3c3c 48%,
    #383838 56%,
    #343434 64%,
    #313131 72%,
    #2e2e2e 80%,
    #2b2b2b 88%,
    #292929 94%,
    #272727 100%);
  box-shadow:
    0 0 0 3px #141414,
    0 0 60px rgba(0,0,0,.95);
}

#poker-table {
  position: relative;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(ellipse at 50% 45%,
      #35302a 0%,
      #332e28 8%,
      #302b25 16%,
      #2d2822 24%,
      #292420 32%,
      #26211c 40%,
      #231f1a 48%,
      #201c18 56%,
      #1d1916 64%,
      #1a1714 72%,
      #171411 80%,
      #14110f 88%,
      #110f0d 94%,
      #0e0c0b 100%);
  border-radius: calc(var(--table-radius) - var(--table-border-w) + 2px);
  box-shadow:
    inset 0 0 140px rgba(0,0,0,.7);
  overflow: hidden;
}

#hu-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  border-radius: inherit;
  opacity: 0;
  transition: opacity .35s ease;
  box-shadow:
    inset 0 0 0 1px rgba(255, 203, 43, 0.425),
    inset 0 0 10px 2px rgba(255, 203, 43, 0.275),
    inset 0 0 22px 4px rgba(255, 203, 43, 0.14);
}
#hu-glow.visible { opacity: 1; }

#board-area {
  position: absolute;
  top: calc(46% - 6px); left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 5;
  width: 72%;
  max-width: 72%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

#place-center {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  color: var(--text);
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,.95);
  letter-spacing: .3px;
  white-space: nowrap;
  opacity: 0.45;
  pointer-events: none;
  text-align: center;
  width: 100%;
  transform: translateY(calc(-20px + 8px));
}
#place-center.hidden { display: none; }
#place-center .place-line {
  font-size: var(--place-text);
  line-height: 1.3;
  min-height: 1.3em;
}

#swipe-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 66%;
  height: 40%;
  z-index: 4;
  touch-action: pan-y;
  pointer-events: auto;
  background: transparent;
}

#top-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(2px, 0.4vmin, 4px);
  margin-bottom: 0;
  width: 100%;
  margin-top: 20px;
}

#pot-display {
  color: var(--gold);
  font-weight: 800;
  font-size: clamp(16px, 2.4vmin, 24px);
  text-shadow: 0 2px 8px rgba(0,0,0,.95), 0 0 18px rgba(255,203,43,.25);
  letter-spacing: .3px;
  white-space: nowrap;
}

#board-cards-wrap {
  position: relative;
  margin-bottom: 0;
  height: var(--board-card-h);
  width: calc(var(--board-card-w) * 5 + clamp(3px, 0.6vmin, 5px) * 4);
  max-width: 100%;
  pointer-events: none;
}

#board-brand-label {
  position: absolute;
  top: 5px;
  bottom: 5px;
  left: 0px;
  right: 0px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 900;
  font-size: clamp(17px, 2.7vmin, 27px);
  letter-spacing: 0;
  color: rgba(255, 255, 255, 0.2);
  text-shadow:
    0 -1px 0 rgba(255, 255, 255, 0.05),
    0 1px 1px rgba(0, 0, 0, 0.85),
    inset 0 1px 2px rgba(0, 0, 0, 0.9);
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  z-index: 0;
  line-height: 1;
  overflow: hidden;
  transform: scaleY(1.5);
  transform-origin: center center;
}

#board-cards {
  position: absolute;
  inset: 0;
  display: flex;
  gap: clamp(3px, 0.6vmin, 5px);
  justify-content: center;
  align-items: center;
  z-index: 1;
  pointer-events: none;
}
#board-cards .card {
  --card-w: var(--board-card-w);
  --card-h: var(--board-card-h);
  font-size: clamp(20px, 3.2vmin, 30px);
  padding: 1px 4px;
  pointer-events: auto;
  cursor: pointer;
  touch-action: manipulation;
}
#board-cards .card .suit { font-size: clamp(24px, 3.8vmin, 36px); }

#board-cards .card.dimmed { position: relative; }
#board-cards .card.dimmed::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(15, 13, 11, 0.65);
  border-radius: inherit;
  pointer-events: none;
  z-index: 2;
}

#table-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: var(--info-row-text);
  color: var(--text);
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,.95);
  letter-spacing: .3px;
  width: 100%;
}
#table-info .info-row {
  white-space: nowrap;
  line-height: 1.3;
  min-height: 1.3em;
  pointer-events: auto;
  touch-action: manipulation;
  cursor: pointer;
}
#table-info .info-row.faded { opacity: 0.45; }
#table-info .info-row.info-row-locked { cursor: default; }
#info-blinds-row { color: inherit; }
#info-timer-row { color: inherit; }

.card {
  width: var(--card-w);
  height: var(--card-h);
  background: #fafafa;
  border-radius: clamp(4px, 0.6vmin, 7px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 1px 3px;
  font-weight: 800;
  font-size: clamp(20px, 3vmin, 30px);
  box-shadow:
    0 3px 8px rgba(0,0,0,.7),
    inset 0 0 0 1px rgba(0,0,0,.08);
  position: relative;
  flex-shrink: 0;
  line-height: 1;
}
.card .rank { line-height: 1; }
.card .suit { line-height: 1; font-size: clamp(24px, 3.6vmin, 36px); }

.card.back {
  background:
    repeating-linear-gradient(45deg,
      #1a2540 0px, #1a2540 3px,
      #243255 3px, #243255 6px);
  border: 1px solid #0a1225;
}
.card.back::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(255,203,43,.28);
  border-radius: clamp(2px, 0.4vmin, 3px);
  background:
    radial-gradient(circle at 30% 30%, rgba(255,203,43,.22) 0%, transparent 55%),
    radial-gradient(circle at center, rgba(255,203,43,.15) 0%, transparent 60%);
}

.style-4color .suit-spades   { color: #1a1a1a; }
.style-4color .suit-hearts   { color: #d63535; }
.style-4color .suit-diamonds { color: #2b6dd6; }
.style-4color .suit-clubs    { color: #1fa04a; }

.style-2color .suit-spades   { color: #1a1a1a; }
.style-2color .suit-clubs    { color: #1a1a1a; }
.style-2color .suit-hearts   { color: #d63535; }
.style-2color .suit-diamonds { color: #d63535; }

#seats { position: absolute; inset: 0; }

.seat {
  position: absolute;
  width: clamp(72px, 11%, 120px);
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 14px;
  z-index: 10;
  pointer-events: none;
}
.seat.eliminated { display: none; }

.seat .seat-cards {
  display: flex;
  gap: clamp(3px, 0.6vmin, 5px);
  justify-content: center;
  min-height: 0;
  margin-bottom: clamp(3px, 0.6vmin, 5px);
  position: relative;
  pointer-events: auto;
  touch-action: manipulation;
  cursor: pointer;
}

.seat .seat-cards .card {
  --card-w: clamp(34px, 5.2vmin, 48px);
  --card-h: clamp(48px, 7.3vmin, 67px);
  font-size: clamp(20px, 3.2vmin, 30px);
  padding: 1px 4px;
  border-radius: clamp(4px, 0.6vmin, 7px);
}
.seat .seat-cards .card .suit { font-size: clamp(24px, 3.8vmin, 36px); }

.seat.hero .seat-cards .card {
  --card-w: clamp(37.8px, 5.58vmin, 48.6px);
  --card-h: clamp(53.1px, 7.83vmin, 68.4px);
  font-size: clamp(21.6px, 3.42vmin, 30.6px);
  box-shadow: 0 3px 10px rgba(0,0,0,.75);
}
.seat.hero .seat-cards .card .suit { font-size: clamp(25.2px, 3.96vmin, 36px); }

.seat .pos-row {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 3px;
  min-height: 1.2em;
}

.seat .pos-name {
  font-weight: 900;
  font-size: clamp(12px, 1.8vmin, 16px);
  color: var(--gold);
  letter-spacing: .5px;
  text-shadow: 0 1px 3px rgba(0,0,0,.95);
  position: relative;
  display: inline-block;
  padding: 0 2px;
  pointer-events: none;
  text-align: center;
}
.seat.active .pos-name {
  color: #fff;
  text-shadow: 0 0 10px var(--gold), 0 1px 3px rgba(0,0,0,.95);
}

.seat .dealer-chip {
  position: absolute;
  width: clamp(16px, 2.2vmin, 20px);
  height: clamp(16px, 2.2vmin, 20px);
  background: radial-gradient(circle at 35% 35%,
    #fff7d4 0%,
    #fdeeb4 15%,
    #f9e28f 30%,
    #f3d466 45%,
    #ecc247 60%,
    #d9aa2e 75%,
    #c69a1e 88%,
    #b8860b 100%);
  font-size: clamp(9px, 1.2vmin, 11px);
  font-weight: 900;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.7);
  border: 1px solid #8a6508;
  z-index: 16;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: color .18s ease, box-shadow .18s ease;
}
.seat .dealer-chip.hidden { display: none; }
.seat .dealer-chip .dealer-letter {
  display: block;
  color: var(--vip-color);
  line-height: 1;
  transition: color .18s ease;
}
.seat .dealer-chip.dealer-chip-pro .dealer-letter { color: var(--pro-color); }
.seat .dealer-chip.dealer-chip-vip .dealer-letter { color: var(--vip-color); }
.seat .dealer-chip.dealer-chip-disabled,
.seat .dealer-chip.dealer-chip-disabled .dealer-letter {
  cursor: default !important;
}

.seat.left .dealer-chip { right: clamp(-26px, -3.4vmin, -22px); top: 28px; left: auto; }
.seat.right .dealer-chip,
.seat.top .dealer-chip { left: clamp(-26px, -3.4vmin, -22px); top: 28px; right: auto; }
.seat.hero .dealer-chip {
  top: clamp(-30px, -3.8vmin, -24px);
  left: 50%;
  right: auto;
  transform: translateX(-50%);
}

@media (min-width: 768px) {
  .seat.left .dealer-chip { right: calc(clamp(-26px, -3.4vmin, -22px) - 10px); }
  .seat.right .dealer-chip,
  .seat.top .dealer-chip { left: calc(clamp(-26px, -3.4vmin, -22px) - 10px); }
}

.seat .stack-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
.seat .stack {
  color: var(--text);
  font-weight: 700;
  font-size: clamp(12px, 1.6vmin, 14px);
  text-shadow: 0 1px 3px rgba(0,0,0,.95);
  position: relative;
  display: inline-block;
  cursor: pointer;
}

.seat:not(.hero) .stack,
.seat .delta-text { pointer-events: none; }

.seat:not(.hero) .stack { pointer-events: auto; touch-action: manipulation; }
.seat.hero .stack { pointer-events: auto; touch-action: manipulation; }

.seat .delta-text {
  position: absolute;
  font-size: clamp(11px, 1.4vmin, 13px);
  font-weight: 500;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,.95);
  pointer-events: none;
  z-index: 20;
}
.seat .delta-text.hidden { display: none; }
.seat .delta-text.positive { color: #4ae08a; }
.seat .delta-text.negative { color: #e05a4a; }

.seat .pos-row .delta-text {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}
.seat.left .pos-row .delta-text  { left: 100%; margin-left: 0px; }
.seat.right .pos-row .delta-text { right: 100%; margin-right: 0px; }

.seat .stack-wrap .delta-text {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 100%;
  margin-right: 4px;
  left: auto;
}

@media (max-width: 767px) {
  .seat .stack-wrap .delta-text {
    margin-right: 0px;
  }
}

.seat.active .seat-cards .card {
  box-shadow: 0 0 12px rgba(255,203,43,.7), 0 3px 8px rgba(0,0,0,.7);
}
.seat.folded .seat-cards .card {
  opacity: .35;
}

.seat.winner .seat-cards .card {
  box-shadow: 0 0 14px 3px rgba(255,203,43,.6), 0 3px 8px rgba(0,0,0,.7);
}

.seat .action-badge {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.9);
  color: var(--text);
  font-size: clamp(9px, 1.2vmin, 11px);
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
  border: 1px solid #3a3530;
  z-index: 22;
  text-transform: uppercase;
  letter-spacing: .5px;
  bottom: clamp(-26px, -3.2vmin, -22px);
  top: auto;
  pointer-events: none;
}
.seat .action-badge.fold  { color: #d0d0d0; border-color: #4a4a4a; }
.seat .action-badge.call  { color: #7ab8ff; border-color: #25445a; }
.seat .action-badge.raise { color: #ff8a7a; border-color: #5a2a25; }
.seat .action-badge.bet   { color: #ff8a7a; border-color: #5a2a25; }
.seat .action-badge.check { color: #7ae5a0; border-color: #255a35; }
.seat .action-badge.allin { color: var(--allin); border-color: #5a2028; }
.seat .action-badge.blind { color: #ffcb2b; border-color: #8a6508; }
.seat .action-badge.hidden { display: none; }

.seat .winner-badge {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: #1a1a1a;
  font-size: clamp(9px, 1.2vmin, 11px);
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 23;
  text-transform: uppercase;
  letter-spacing: .8px;
  bottom: clamp(-54px, -6.6vmin, -48px);
  top: auto;
  pointer-events: none;
}
.seat .winner-badge.hidden { display: none; }
.seat .winner-badge.win {
  background: linear-gradient(180deg,
    #ffe07a 0%,
    #ffd94f 15%,
    #ffd343 30%,
    #f8c935 45%,
    #efbe28 60%,
    #e4b020 75%,
    #d8a419 88%,
    #c99c13 100%);
  border: 1px solid #8a6508;

  const STREETS = ['preflop', 'flop', 'turn', 'river'];

  const POSITION_LABELS = {
    8: ['BTN','SB','BB','UTG','UTG1','LJ','HJ','CO'],
    7: ['BTN','SB','BB','UTG1','LJ','HJ','CO'],
    6: ['BTN','SB','BB','LJ','HJ','CO'],
    5: ['BTN','SB','BB','HJ','CO'],
    4: ['BTN','SB','BB','CO'],
    3: ['BTN','SB','BB'],
    2: ['BTN','BB'],
    1: []
  };

  function cryptoRandomInt(maxExclusive) {
    if (maxExclusive <= 0) return 0;
    const range = 0x100000000;
    const limit = range - (range % maxExclusive);
    const buf = new Uint32Array(1);
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % maxExclusive;
  }

  function createDeck() {
    const deck = [];
    for (const s of SUITS) for (const r of RANKS) deck.push({ rank: r, suit: s });
    return deck;
  }

  function shuffle(deck) {
    const d = deck.slice();
    for (let i = d.length - 1; i > 0; i--) {
      const j = cryptoRandomInt(i + 1);
      [d[i], d[j]] = [d[j], d[i]];
    }
    return d;
  }

  function combinations(arr, k) {
    const result = [];
    const combo = [];
    (function recurse(start) {
      if (combo.length === k) { result.push(combo.slice()); return; }
      for (let i = start; i < arr.length; i++) { combo.push(arr[i]); recurse(i + 1); combo.pop(); }
    })(0);
    return result;
  }

  function evaluate5(cards) {
    const values = cards.map(c => RANK_VALUE[c.rank]).sort((a,b) => b - a);
    const suits = cards.map(c => c.suit);
    const isFlush = suits.every(s => s === suits[0]);
    const uniqueVals = [...new Set(values)].sort((a,b) => b - a);
    let straightHigh = 0;
    for (let i = 0; i <= uniqueVals.length - 5; i++) {
      if (uniqueVals[i] - uniqueVals[i+4] === 4) { straightHigh = uniqueVals[i]; break; }
    }
    if (!straightHigh && uniqueVals.includes(14) && uniqueVals.includes(2) &&
        uniqueVals.includes(3) && uniqueVals.includes(4) && uniqueVals.includes(5)) straightHigh = 5;

    const freq = {};
    for (const v of values) freq[v] = (freq[v] || 0) + 1;
    const groups = Object.entries(freq).map(([v, c]) => [c, Number(v)]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);

    if (isFlush && straightHigh) {
      if (straightHigh === 14) return { category: HAND_CATEGORIES.ROYAL_FLUSH, ranks: [14], cards, name: 'Royal Flush' };
      return { category: HAND_CATEGORIES.STRAIGHT_FLUSH, ranks: [straightHigh], cards, name: 'Straight Flush' };
    }
    if (groups[0][0] === 4) return { category: HAND_CATEGORIES.QUADS, ranks: [groups[0][1], groups[1][1]], cards, name: 'Four of a Kind' };
    if (groups[0][0] === 3 && groups[1] && groups[1][0] === 2) return { category: HAND_CATEGORIES.FULL_HOUSE, ranks: [groups[0][1], groups[1][1]], cards, name: 'Full House' };
    if (isFlush) return { category: HAND_CATEGORIES.FLUSH, ranks: values, cards, name: 'Flush' };
    if (straightHigh) return { category: HAND_CATEGORIES.STRAIGHT, ranks: [straightHigh], cards, name: 'Straight' };
    if (groups[0][0] === 3) return { category: HAND_CATEGORIES.TRIPS, ranks: [groups[0][1], ...groups.slice(1).map(g => g[1])], cards, name: 'Three of a Kind' };
    if (groups[0][0] === 2 && groups[1] && groups[1][0] === 2) return { category: HAND_CATEGORIES.TWO_PAIR, ranks: [groups[0][1], groups[1][1], groups[2][1]], cards, name: 'Two Pair' };
    if (groups[0][0] === 2) return { category: HAND_CATEGORIES.PAIR, ranks: [groups[0][1], ...groups.slice(1).map(g => g[1])], cards, name: 'One Pair' };
    return { category: HAND_CATEGORIES.HIGH_CARD, ranks: values, cards, name: 'High Card' };
  }

  function compareScores(a, b) {
    if (a.category !== b.category) return a.category - b.category;
    const len = Math.max(a.ranks.length, b.ranks.length);
    for (let i = 0; i < len; i++) {
      const ra = a.ranks[i] ?? 0, rb = b.ranks[i] ?? 0;
      if (ra !== rb) return ra - rb;
    }
    return 0;
  }

  function evaluateHand(cards) {
    if (cards.length < 5) return null;
    const combos = combinations(cards, 5);
    let best = null;
    for (const combo of combos) {
      const score = evaluate5(combo);
      if (!best || compareScores(score, best) > 0) best = score;
    }
    return best;
  }

  function buildSidePots(contributions, activePlayers) {
    const entries = Object.entries(contributions).filter(([_, amt]) => amt > 0).map(([id, amt]) => ({ id, amt }));
    entries.sort((a, b) => a.amt - b.amt);
    const pots = [];
    let prev = 0;
    const remaining = entries.map(e => ({ ...e }));
    while (remaining.length > 0) {
      const minAmt = remaining[0].amt;
      const level = minAmt - prev;
      if (level <= 0) { remaining.shift(); continue; }
      let potAmount = 0;
      const contributors = [];
      for (const e of remaining) { potAmount += level; contributors.push(e.id); e.amt -= level; }
      prev = minAmt;
      const eligible = contributors.filter(id => activePlayers.has(id));
      if (potAmount > 0) pots.push({ amount: potAmount, eligible });
      while (remaining.length > 0 && remaining[0].amt <= 0) remaining.shift();
    }
    return pots;
  }

  function getBlindLevel(levelIndex) {
    return BLIND_LEVELS[Math.min(levelIndex, BLIND_LEVELS.length - 1)];
  }

  function createInitialState(playerConfigs) {
    const players = playerConfigs.map((cfg, i) => ({
      id: cfg.id, seatIndex: i, name: cfg.name, isHero: !!cfg.isHero,
      botType: cfg.botType || null, botClass: cfg.botClass || null,
      stack: cfg.stack ?? STARTING_STACK,
      holeCards: [], folded: false, allIn: false, eliminated: false,
      committedThisStreet: 0, committedTotal: 0, hasActedThisStreet: false,
      lastAction: null, position: null,
      acted: false, blindPaid: 0, revealed: false,
      inHand: false,
      heroFinishPlace: 0
    }));
    return {
      handNumber: 0, levelIndex: 0, handsAtLevel: 0, buttonIndex: 0,
      players, deck: [], board: [], pot: 0, currentBet: 0, minRaise: 0,
      street: 'preflop', actingIndex: 0, lastAggressorIndex: null,
      actionLog: [], handOver: false, showdownResults: null,
      finalStreet: null,
      blinds: { sb: 10, bb: 20, ante: 0 },
      _deckIdx: 0
    };
  }

  function dealHoleCards(state) {
    state.deck = shuffle(createDeck());
    let deckIdx = 0;
    const n = state.players.length;
    const sbIndex = (state.buttonIndex + 1) % n;
    for (const p of state.players) p.holeCards = [];
    for (let round = 0; round < 2; round++) {
      for (let i = 0; i < n; i++) {
        const idx = (sbIndex + i) % n;
        const p = state.players[idx];
        if (p.eliminated) continue;
        p.holeCards.push(state.deck[deckIdx++]);
      }
    }
    state._deckIdx = deckIdx;
  }

  function burnCard(state) { state._deckIdx += 1; }

  function dealBoard(state, count) {
    burnCard(state);
    for (let i = 0; i < count; i++) state.board.push(state.deck[state._deckIdx++]);
  }

  function assignPositions(state) {
    const n = state.players.length;
    let alive = 0;
    for (const p of state.players) if (!p.eliminated) alive++;
    const labels = POSITION_LABELS[alive] || [];
    if (alive <= 1) {
      for (const p of state.players) {
        if (p.eliminated) p.position = null;
        else p.position = '—';
      }
      return;
    }
    const aliveOrder = [];
    for (let i = 0; i < n; i++) {
      const idx = (state.buttonIndex + i) % n;
      if (!state.players[idx].eliminated) aliveOrder.push(idx);
    }
    for (let i = 0; i < aliveOrder.length; i++) {
      state.players[aliveOrder[i]].position = labels[i] || '—';
    }
    for (const p of state.players) {
      if (p.eliminated) p.position = null;
    }
  }
  
  function preflopOrder(state) {
    const n = state.players.length;
    const alive = state.players.filter(p => !p.eliminated).length;
    if (alive === 2) {
      const btnIdx = state.buttonIndex;
      const order = [];
      let cur = btnIdx;
      for (let i = 0; i < n; i++) {
        if (!state.players[cur].eliminated) order.push(cur);
        cur = (cur + 1) % n;
      }
      return order;
    }
    const order = [];
    for (let i = 0; i < n; i++) order.push((state.buttonIndex + 3 + i) % n);
    return order;
  }

  function postflopOrder(state) {
    const n = state.players.length;
    const order = [];
    for (let i = 0; i < n; i++) order.push((state.buttonIndex + 1 + i) % n);
    return order;
  }

  function postBlinds(state) {
    const n = state.players.length;
    const alive = state.players.filter(p => !p.eliminated).length;
    let sbIndex = (state.buttonIndex + 1) % n;
    let guard = 0;
    while (state.players[sbIndex].eliminated && guard < n) { sbIndex = (sbIndex + 1) % n; guard++; }
    let bbIndex = (sbIndex + 1) % n;
    guard = 0;
    while (state.players[bbIndex].eliminated && guard < n) { bbIndex = (bbIndex + 1) % n; guard++; }

    const { sb, bb, ante } = state.blinds;

    if (ante > 0) {
      for (const p of state.players) {
        if (p.eliminated || p.stack <= 0) continue;
        const pay = Math.min(ante, p.stack);
        p.stack -= pay; p.committedTotal += pay; state.pot += pay;
      }
    }

    if (alive === 2) {
      const btnPlayer = state.players[state.buttonIndex];
      if (!btnPlayer.eliminated) {
        const pay = Math.min(sb, btnPlayer.stack);
        btnPlayer.stack -= pay; btnPlayer.committedThisStreet += pay;
        btnPlayer.committedTotal += pay; state.pot += pay;
        btnPlayer.lastAction = 'sb';
        btnPlayer.blindPaid = pay;
        if (btnPlayer.stack === 0) btnPlayer.allIn = true;
      }
      const bbPlayer = state.players[bbIndex];
      if (!bbPlayer.eliminated) {
        const pay = Math.min(bb, bbPlayer.stack);
        bbPlayer.stack -= pay; bbPlayer.committedThisStreet += pay;
        bbPlayer.committedTotal += pay; state.pot += pay;
        bbPlayer.lastAction = 'bb';
        bbPlayer.blindPaid = pay;
        if (bbPlayer.stack === 0) bbPlayer.allIn = true;
      }
      state.currentBet = bb;
      state.minRaise = bb;
      return { sbIndex: state.buttonIndex, bbIndex };
    }

    const sbPlayer = state.players[sbIndex];
    if (!sbPlayer.eliminated) {
      const pay = Math.min(sb, sbPlayer.stack);
      sbPlayer.stack -= pay; sbPlayer.committedThisStreet += pay;
      sbPlayer.committedTotal += pay; state.pot += pay;
      sbPlayer.lastAction = 'sb';
      sbPlayer.blindPaid = pay;
    }
    const bbPlayer = state.players[bbIndex];
    if (!bbPlayer.eliminated) {
      const pay = Math.min(bb, bbPlayer.stack);
      bbPlayer.stack -= pay; bbPlayer.committedThisStreet += pay;
      bbPlayer.committedTotal += pay; state.pot += pay;
      bbPlayer.lastAction = 'bb';
      bbPlayer.blindPaid = pay;
      if (bbPlayer.stack === 0) bbPlayer.allIn = true;
    }
    state.currentBet = bb;
    state.minRaise = bb;
    return { sbIndex, bbIndex };
  }

  function canAct(player) {
    return !player.folded && !player.allIn && !player.eliminated && player.stack > 0;
  }

  function isBettingRoundComplete(state) {
    const active = state.players.filter(p => !p.folded && !p.eliminated);
    if (active.length <= 1) return true;
    for (const p of active) {
      if (p.allIn) continue;
      if (!p.hasActedThisStreet) return false;
      if (p.committedThisStreet < state.currentBet) return false;
    }
    return true;
  }

  function applyAction(state, playerIndex, action) {
    const p = state.players[playerIndex];
    if (!p || p.folded || p.allIn || p.eliminated) return { ok: false, error: 'Player cannot act' };
    const toCall = Math.max(0, state.currentBet - p.committedThisStreet);

    switch (action.type) {
      case 'fold':
        p.folded = true; p.hasActedThisStreet = true; p.lastAction = 'fold';
        break;

      case 'check':
        if (toCall > 0) return { ok: false, error: 'Cannot check' };
        p.hasActedThisStreet = true; p.lastAction = 'check';
        p.acted = true;
        break;

      case 'call': {
        const pay = Math.min(toCall, p.stack);
        p.stack -= pay; p.committedThisStreet += pay;
        p.committedTotal += pay; state.pot += pay;
        p.hasActedThisStreet = true;
        p.lastAction = (p.stack === 0) ? 'allin' : 'call';
        p.acted = true;
        if (p.stack === 0) p.allIn = true;
        break;
      }

      case 'bet': {
        if (state.currentBet > 0) return { ok: false, error: 'Already a bet on this street' };
        if (p.committedThisStreet > 0) return { ok: false, error: 'Already a contribution' };
        const target = action.amount;
        if (target <= 0) return { ok: false, error: 'Bet must be positive' };
        const need = target - p.committedThisStreet;
        if (need > p.stack) return { ok: false, error: 'Not enough chips' };
        p.stack -= need; p.committedThisStreet += need;
        p.committedTotal += need; state.pot += need;
        state.minRaise = Math.max(state.minRaise, target);
        state.currentBet = target; state.lastAggressorIndex = playerIndex;
        for (const other of state.players) {
          if (other !== p && !other.folded && !other.eliminated && !other.allIn) other.hasActedThisStreet = false;
        }
        p.hasActedThisStreet = true;
        p.lastAction = (p.stack === 0) ? 'allin' : 'bet';
        p.acted = true;
        if (p.stack === 0) p.allIn = true;
        break;
      }

      case 'raise': {
        const target = action.amount;
        if (target <= state.currentBet) return { ok: false, error: 'Raise below current bet' };
        const need = target - p.committedThisStreet;
        if (need > p.stack) return { ok: false, error: 'Not enough chips' };
        const raiseSize = target - state.currentBet;
        if (raiseSize < state.minRaise && need < p.stack) return { ok: false, error: 'Raise below minimum' };
        p.stack -= need; p.committedThisStreet += need;
        p.committedTotal += need; state.pot += need;
        state.minRaise = Math.max(state.minRaise, raiseSize);
        state.currentBet = target; state.lastAggressorIndex = playerIndex;
        for (const other of state.players) {
          if (other !== p && !other.folded && !other.eliminated && !other.allIn) other.hasActedThisStreet = false;
        }
        p.hasActedThisStreet = true;
        p.lastAction = (p.stack === 0) ? 'allin' : 'raise';
        p.acted = true;
        if (p.stack === 0) p.allIn = true;
        break;
      }

      case 'allin': {
        const pay = p.stack;
        const target = p.committedThisStreet + pay;
        p.stack = 0; p.committedThisStreet = target;
        p.committedTotal += pay; state.pot += pay;
        p.allIn = true; p.hasActedThisStreet = true;
        p.lastAction = 'allin';
        p.acted = true;
        if (target > state.currentBet) {
          const raiseSize = target - state.currentBet;
          state.minRaise = Math.max(state.minRaise, raiseSize);
          state.currentBet = target; state.lastAggressorIndex = playerIndex;
          for (const other of state.players) {
            if (other !== p && !other.folded && !other.eliminated && !other.allIn) other.hasActedThisStreet = false;
          }
        }
        break;
      }

      default: return { ok: false, error: 'Unknown action: ' + action.type };
    }
    return { ok: true };
  }

  function nextActor(state) {
    const n = state.players.length;
    const start = state.actingIndex;
    for (let step = 1; step <= n; step++) {
      const idx = (start + step) % n;
      const p = state.players[idx];
      if (canAct(p)) {
        if (!p.hasActedThisStreet) return idx;
        if (p.committedThisStreet < state.currentBet) return idx;
      }
    }
    return -1;
  }

  function resetStreetState(state) {
    for (const p of state.players) {
      p.committedThisStreet = 0; p.hasActedThisStreet = false;
      if (p.lastAction !== 'fold' && p.lastAction !== 'allin') p.lastAction = null;
    }
    state.currentBet = 0; state.minRaise = state.blinds.bb; state.lastAggressorIndex = null;
  }

  function startStreet(state, street) {
    state.street = street;
    resetStreetState(state);
    if (street === 'flop')  dealBoard(state, 3);
    if (street === 'turn')  dealBoard(state, 1);
    if (street === 'river') dealBoard(state, 1);
    const actionable = state.players.filter(p => canAct(p) && !p.folded);
    if (actionable.length < 2) return false;
    const order = postflopOrder(state);
    for (const idx of order) {
      if (canAct(state.players[idx])) { state.actingIndex = idx; return true; }
    }
    return false;
  }

  function finalizeHand(state) {
    const lastStreet = state.street;
    state.finalStreet = lastStreet;
    while (state.board.length < 5) {
      if (state.board.length === 0) dealBoard(state, 3);
      else dealBoard(state, 1);
    }
    for (const p of state.players) {
      if (p.eliminated) { p.revealed = false; continue; }
      p.revealed = !p.folded || p.acted;
    }
  }

  function showdown(state) {
    const contenders = state.players.filter(p => !p.folded && !p.eliminated);
    const scores = new Map();
    for (const p of contenders) {
      const allCards = [...p.holeCards, ...state.board];
      scores.set(p.id, allCards.length >= 5 ? evaluateHand(allCards) : null);
    }
    const contributions = {};
    for (const p of state.players) contributions[p.id] = p.committedTotal;
    const activeIds = new Set(contenders.map(p => p.id));
    const pots = buildSidePots(contributions, activeIds);
    const payouts = {};
    const potResults = [];

    for (const pot of pots) {
      const eligible = pot.eligible.filter(id => scores.get(id));
      if (eligible.length === 0) continue;
      let bestScore = null; let winners = [];
      for (const id of eligible) {
        const sc = scores.get(id);
        if (!bestScore || compareScores(sc, bestScore) > 0) { bestScore = sc; winners = [id]; }
        else if (compareScores(sc, bestScore) === 0) winners.push(id);
      }
      const share = Math.floor(pot.amount / winners.length);
      let remainder = pot.amount - share * winners.length;
      for (const wid of winners) {
        const extra = remainder > 0 ? 1 : 0;
        if (remainder > 0) remainder--;
        payouts[wid] = (payouts[wid] || 0) + share + extra;
      }
      potResults.push({
        amount: pot.amount,
        winners: winners.map(id => state.players.find(p => p.id === id).name),
        winnersIds: winners
      });
    }

    for (const [id, amount] of Object.entries(payouts)) {
      const p = state.players.find(pl => pl.id === id || pl.id === Number(id));
      if (p) p.stack += amount;
    }

    let topWinnerId = null; let topAmount = -1;
    for (const [id, amount] of Object.entries(payouts)) {
      if (amount > topAmount) { topAmount = amount; topWinnerId = id; }
    }

    state.showdownResults = {
      scores: Object.fromEntries([...scores.entries()].map(([id, sc]) =>
        [id, sc ? { category: sc.category, name: sc.name, ranks: sc.ranks } : null])),
      pots: potResults, payouts, topWinnerId
    };
    state.handOver = true;
    return state.showdownResults;
  }

  function awardToLastStanding(state) {
    const alive = state.players.filter(p => !p.folded && !p.eliminated);
    if (alive.length !== 1) return null;
    const winner = alive[0];
    winner.stack += state.pot;
    state.showdownResults = {
      scores: {}, pots: [{ amount: state.pot, winners: [winner.name], winnersIds: [winner.id] }],
      payouts: { [winner.id]: state.pot }, topWinnerId: winner.id, uncontested: true
    };
    state.handOver = true;
    return state.showdownResults;
  }

  function startHand(state) {
    state.board = []; state.pot = 0; state.currentBet = 0; state.minRaise = 0;
    state.actionLog = []; state.handOver = false; state.showdownResults = null;
    state.finalStreet = null;

    for (const p of state.players) {
      p.folded = p.eliminated; p.allIn = false;
      p.committedThisStreet = 0; p.committedTotal = 0;
      p.hasActedThisStreet = false; p.lastAction = null; p.holeCards = [];
      p.acted = false; p.blindPaid = 0; p.revealed = false;
      p.inHand = !p.eliminated;
    }

    const n = state.players.length;
    let next = (state.buttonIndex + 1) % n;
    let guard = 0;
    while (state.players[next].eliminated && guard < n) { next = (next + 1) % n; guard++; }
    state.buttonIndex = next;

    state.handNumber += 1;
    state.street = 'preflop';
    state.blinds = getBlindLevel(state.levelIndex);

    assignPositions(state);
    dealHoleCards(state);
    postBlinds(state);

    const order = preflopOrder(state);
    let firstIdx = -1;
    for (const idx of order) if (canAct(state.players[idx])) { firstIdx = idx; break; }
    state.actingIndex = firstIdx >= 0 ? firstIdx : 0;
    return state;
  }

  function advanceStreet(state) {
    const alive = state.players.filter(p => !p.folded && !p.eliminated);
    if (alive.length === 1) { awardToLastStanding(state); return { done: true, results: state.showdownResults }; }

    const idx = STREETS.indexOf(state.street);
    if (idx < 0 || idx >= STREETS.length - 1) { showdown(state); return { done: true, results: state.showdownResults }; }

    const nextStreet = STREETS[idx + 1];
    const canContinue = startStreet(state, nextStreet);

    if (!canContinue) {
      while (STREETS.indexOf(state.street) < STREETS.length - 1) {
        const nIdx = STREETS.indexOf(state.street) + 1;
        startStreet(state, STREETS[nIdx]);
      }
      showdown(state);
      return { done: true, results: state.showdownResults };
    }
    return { done: false, street: state.street };
  }

  function endBettingRound(state) { return advanceStreet(state); }

  return {
    SUITS, RANKS, RANK_VALUE, HAND_CATEGORIES,
    BLIND_LEVELS, STARTING_STACK, SEATS, STREETS, POSITION_LABELS,
    cryptoRandomInt, createDeck, shuffle,
    evaluateHand, evaluate5, compareScores,
    getBlindLevel, createInitialState,
    dealHoleCards, dealBoard, assignPositions,
    preflopOrder, postflopOrder, postBlinds,
    canAct, isBettingRoundComplete, applyAction, nextActor,
    startStreet,
    startHand, advanceStreet, endBettingRound,
    showdown, finalizeHand
  };

})();

const VipBots = (() => {

  const R = Engine.RANK_VALUE;
  const CLASS_VIP = 'VIP';

  const TYPES = {
    VIP_TAGLITE: { key: 'VIP_TAGLITE', cls: CLASS_VIP },
    VIP_LOOSE:   { key: 'VIP_LOOSE',   cls: CLASS_VIP },
    VIP_ROCK:    { key: 'VIP_ROCK',    cls: CLASS_VIP },
    VIP_MANIAC:  { key: 'VIP_MANIAC',  cls: CLASS_VIP }
  };

  const PROFILES = {
    VIP_TAGLITE: { aggression: 0.55, looseness: 0.40, bluff: 0.12, callThreshold: 0.60 },
    VIP_LOOSE:   { aggression: 0.22, looseness: 0.72, bluff: 0.06, callThreshold: 0.35 },
    VIP_ROCK:    { aggression: 0.12, looseness: 0.14, bluff: 0.02, callThreshold: 0.85 },
    VIP_MANIAC:  { aggression: 0.95, looseness: 0.92, bluff: 0.62, callThreshold: 0.22 }
  };

  const CHARTS = {
    OPEN_UTG:  ['22+','A2s+','K7s+','Q8s+','J8s+','T8s+','97s+','86s+','75s+','64s+','54s','ATo+','KJo+','QJo','JTo'],
    OPEN_UTG1: ['22+','A2s+','K6s+','Q8s+','J8s+','T8s+','97s+','86s+','75s+','64s+','54s','ATo+','KTo+','QTo+','JTo'],
    OPEN_MP:   ['22+','A2s+','K5s+','Q7s+','J7s+','T7s+','96s+','85s+','75s+','64s+','53s+','43s','A9o+','KTo+','QTo+','JTo','T9o'],
    OPEN_HJ:   ['22+','A2s+','K3s+','Q6s+','J7s+','T7s+','96s+','85s+','74s+','63s+','52s+','43s','A7o+','KTo+','QTo+','JTo','T9o','98o'],
    OPEN_CO:   ['22+','A2s+','K2s+','Q5s+','J6s+','T6s+','95s+','84s+','73s+','63s+','52s+','42s+','32s','A4o+','K9o+','Q9o+','J9o+','T9o','98o','87o'],
    OPEN_BTN:  ['22+','A2s+','K2s+','Q2s+','J3s+','T5s+','94s+','83s+','72s+','62s+','52s+','42s+','32s','A2o+','K5o+','Q7o+','J8o+','T8o+','98o','87o','76o','65o'],
    OPEN_SB:   ['22+','A2s+','K2s+','Q2s+','J2s+','T4s+','93s+','82s+','72s+','62s+','52s+','42s+','32s','A2o+','K4o+','Q6o+','J7o+','T8o+','98o','87o','76o','65o','54o'],
    CALL_RAISE: ['22-99','A2s+','K9s+','Q9s+','J9s+','T8s+','98s','87s','76s','65s','54s','ATo+','KJo+','QJo','JTo','A9o','KTo','QTo']
  };

  const chartCache = {};

  function normalizeHand(c1, c2) {
    const r1 = c1.rank, r2 = c2.rank;
    const v1 = R[r1], v2 = R[r2];
    if (v1 === v2) return r1 + r2;
    const hi = v1 > v2 ? r1 : r2;
    const lo = v1 > v2 ? r2 : r1;
    const suited = c1.suit === c2.suit ? 's' : 'o';
    return hi + lo + suited;
  }

  function rankFromValue(v) {
    for (const r of Engine.RANKS) if (R[r] === v) return r;
    return '?';
  }

  function expandChart(entries) {
    const set = new Set();
    for (const entry of entries) {
      let m;
      if ((m = entry.match(/^([2-9TJQKA])\1-([2-9TJQKA])\2$/))) {
        const from = R[m[1]], to = R[m[2]];
        for (let v = from; v <= to; v++) { const r = rankFromValue(v); set.add(r + r); }
        continue;
      }
      if ((m = entry.match(/^([2-9TJQKA])\1\+$/))) {
        const from = R[m[1]];
        for (let v = from; v <= 14; v++) { const r = rankFromValue(v); set.add(r + r); }
        continue;
      }
      if ((m = entry.match(/^([2-9TJQKA])\1$/))) { set.add(m[1] + m[1]); continue; }
      if ((m = entry.match(/^([2-9TJQKA])([2-9TJQKA])([so])\+$/))) {
        const hi = m[1], lo = m[2], suit = m[3];
        const hiV = R[hi], loV = R[lo];
        for (let v = loV; v < hiV; v++) { const r = rankFromValue(v); set.add(hi + r + suit); }
        continue;
      }
      if ((m = entry.match(/^([2-9TJQKA])([2-9TJQKA])([so])$/))) { set.add(m[1] + m[2] + m[3]); continue; }
      if ((m = entry.match(/^([2-9TJQKA])([2-9TJQKA])([so])-([2-9TJQKA])([2-9TJQKA])([so])$/))) {
        const hi = m[1], loFrom = R[m[2]], loTo = R[m[4]], suit = m[3];
        const hiV = R[hi];
        for (let v = loFrom; v <= loTo; v++) {
          if (v >= hiV) continue;
          const r = rankFromValue(v); set.add(hi + r + suit);
        }
        continue;
      }
    }
    return set;
  }

  function getChart(name) {
    if (!chartCache[name]) chartCache[name] = expandChart(CHARTS[name] || []);
    return chartCache[name];
  }

  function handInChart(card1, card2, chartName) {
    if (!CHARTS[chartName]) return false;
    return getChart(chartName).has(normalizeHand(card1, card2));
  }

  function assignBotTypes() {
    return ['VIP_TAGLITE', 'VIP_TAGLITE', 'VIP_TAGLITE', 'VIP_MANIAC', 'VIP_MANIAC', 'VIP_ROCK', 'VIP_LOOSE'];
  }

  function assignBotsToSeats(botTypes) {
    const arr = botTypes.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Engine.cryptoRandomInt(i + 1);
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function preflopStrength(card1, card2) {
    const v1 = R[card1.rank], v2 = R[card2.rank];
    const hi = Math.max(v1, v2), lo = Math.min(v1, v2);
    const suited = card1.suit === card2.suit;
    if (v1 === v2) return 0.5 + (hi - 2) / 12 * 0.5;
    let s = (hi - 2) / 12 * 0.55 + (lo - 2) / 12 * 0.25;
    if (suited) s += 0.08;
    if (hi === 14) s += 0.05;
    if (Math.abs(hi - lo) === 1) s += 0.04;
    if (Math.abs(hi - lo) === 2) s += 0.02;
    return Math.min(1, Math.max(0, s));
  }

  function postflopStrength(handScore) {
    if (!handScore) return 0;
    const base = [0.15,0.35,0.55,0.70,0.78,0.85,0.92,0.97,0.99,1.00][handScore.category] || 0;
    const rank = handScore.ranks[0] || 0;
    return Math.min(1, base + (rank / 14) * 0.05);
  }

  function openChartFor(position) {
    switch (position) {
      case 'UTG':  return 'OPEN_UTG';
      case 'UTG1': return 'OPEN_UTG1';
      case 'LJ':   return 'OPEN_MP';
      case 'HJ':   return 'OPEN_HJ';
      case 'CO':   return 'OPEN_CO';
      case 'BTN':  return 'OPEN_BTN';
      case 'SB':   return 'OPEN_SB';
      case 'BB':   return 'OPEN_BTN';
      default:     return 'OPEN_BTN';
    }
  }

  function makeDiagnostics(base) {
    return {
      source: 'vip',
      strength: base.strength,
      preflopStrength: base.preflopStrength,
      postflopStrength: base.postflopStrength,
      handName: base.handName,
      chart: base.chart,
      threshold: base.threshold,
      reason: base.reason
    };
  }

  function decidePreflop(ctx) {
    const profile = PROFILES[ctx.botType];
    if (!profile) return { action: 'fold', amount: 0, diagnostics: makeDiagnostics({ reason: 'no profile' }) };

    const card1 = ctx.card1, card2 = ctx.card2;
    const position = ctx.position;
    const myStack = ctx.myStack;
    const bb = ctx.bb;
    const toCall = ctx.toCall;
    const pot = ctx.pot;
    const numActive = ctx.numActive;

    const strength = preflopStrength(card1, card2);
    const diagBase = {
      strength: strength,
      preflopStrength: strength,
      postflopStrength: null,
      handName: '—',
      chart: null,
      threshold: null,
      reason: ''
    };

    if (toCall === 0) {
      const chart = openChartFor(position);
      const inChart = handInChart(card1, card2, chart);
      if (inChart) {
        const openSize = Math.round(bb * (numActive > 5 ? 3 : 2.5));
        return { action: 'raise', amount: Math.min(myStack, openSize), diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'open', reason: 'in open chart, raise' })) };
      }
      if (profile.looseness > 0.7 && strength > 0.25 && Math.random() < profile.bluff * 0.5) {
        const openSize = Math.round(bb * 2.5);
        return { action: 'raise', amount: Math.min(myStack, openSize), diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'bluff', reason: 'loose bluff raise' })) };
      }
      return { action: 'check', amount: 0, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'check', reason: 'not in open chart, check' })) };
    }

    const chart = 'CALL_RAISE';
    const inChart = handInChart(card1, card2, chart);
    if (inChart) return { action: 'call', amount: toCall, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'call chart', reason: 'in call chart, call' })) };
    if (profile.looseness > 0.6 && strength > 0.35) return { action: 'call', amount: toCall, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'loose', reason: 'loose call' })) };
    if (profile.aggression > 0.7 && strength > 0.6 && Math.random() < profile.aggression * 0.4) {
      const size = Math.min(myStack, Math.round((pot + toCall) * 3));
      return { action: 'raise', amount: size, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'aggro', reason: 'aggressive re-raise' })) };
    }
    return { action: 'fold', amount: 0, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { chart, threshold: 'fold', reason: 'not in call chart, fold' })) };
  }

  function decidePostflop(ctx) {
    const profile = PROFILES[ctx.botType];
    if (!profile) return { action: 'fold', amount: 0, diagnostics: makeDiagnostics({ reason: 'no profile' }) };

    const card1 = ctx.card1, card2 = ctx.card2;
    const board = ctx.board || [];
    const toCall = ctx.toCall || 0;
    const pot = ctx.pot || 0;
    const myStack = ctx.myStack || 0;
    const bb = ctx.bb || 1;
    const street = ctx.street;

    const allCards = [card1, card2, ...board];
    const handScore = allCards.length >= 5 ? Engine.evaluateHand(allCards) : null;
    const strength = handScore ? postflopStrength(handScore) : preflopStrength(card1, card2);
    const streetBonus = street === 'river' ? 0.05 : 0;

    const diagBase = {
      strength: strength,
      preflopStrength: null,
      postflopStrength: strength,
      handName: handScore ? handScore.name : '—',
      chart: null,
      threshold: null,
      reason: ''
    };

    if (toCall === 0) {
      if (strength + streetBonus > 0.65) {
        const betSize = Math.round(pot * 0.5);
        return { action: 'bet', amount: Math.min(myStack, Math.max(bb, betSize)), diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'strong', reason: 'strong hand, bet' })) };
      }
      if (strength > 0.4 && Math.random() < profile.aggression * 0.5) {
        const betSize = Math.round(pot * 0.5);
        return { action: 'bet', amount: Math.min(myStack, Math.max(bb, betSize)), diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'medium', reason: 'medium hand, aggressive bet' })) };
      }
      if (Math.random() < profile.bluff * 0.25) {
        const betSize = Math.round(pot * 0.6);
        return { action: 'bet', amount: Math.min(myStack, Math.max(bb, betSize)), diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'bluff', reason: 'bluff bet' })) };
      }
      return { action: 'check', amount: 0, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'weak', reason: 'weak, check' })) };
    }

    const potOdds = toCall / (pot + toCall);

    if (strength + streetBonus > 0.75) {
      if (profile.aggression > 0.5 && Math.random() < profile.aggression) {
        const raiseSize = Math.min(myStack, Math.round((pot + toCall) * 2.2));
        return { action: 'raise', amount: raiseSize, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'very strong', reason: 'very strong, raise' })) };
      }
      return { action: 'call', amount: toCall, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'very strong', reason: 'very strong, call' })) };
    }

    if (strength > profile.callThreshold && strength > potOdds * 1.5) {
      return { action: 'call', amount: toCall, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'call', reason: 'above threshold, call' })) };
    }

    if (strength > 0.3 && Math.random() < profile.bluff * 0.15) {
      const raiseSize = Math.min(myStack, Math.round((pot + toCall) * 2.5));
      return { action: 'raise', amount: raiseSize, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'bluff', reason: 'bluff raise' })) };
    }

    return { action: 'fold', amount: 0, diagnostics: makeDiagnostics(Object.assign({}, diagBase, { threshold: 'fold', reason: 'below threshold, fold' })) };
  }

  function decide(ctx) {
    if (!ctx || !ctx.botType) return { action: 'fold', amount: 0, diagnostics: makeDiagnostics({ reason: 'invalid ctx' }) };
    return ctx.street === 'preflop' ? decidePreflop(ctx) : decidePostflop(ctx);
  }

  function getProfile(botType) { return PROFILES[botType] || null; }
  function getTypeMeta(botType) { return TYPES[botType] || null; }

  function updateModel() {}
  function updateMeta() {}
  function getRead() { return null; }
  function reset() {}
  function dumpStats() { return []; }

  const VipTexture = {
    analyze: function(board) {
      const result = { wet: 0, paired: false, flushPossible: false, straightPossible: false, highCard: 0, flushSuit: null, suitedCount: 0 };
      if (!board || board.length === 0) return result;
      const values = board.map(c => R[c.rank]);
      const suits = board.map(c => c.suit);
      const sorted = values.slice().sort((a, b) => b - a);
      result.highCard = sorted[0] || 0;
      const freq = {};
      for (const v of values) freq[v] = (freq[v] || 0) + 1;
      result.paired = Object.values(freq).some(v => v >= 2);
      const suitFreq = {};
      for (const s of suits) suitFreq[s] = (suitFreq[s] || 0) + 1;
      let suitedCount = 0; let flushSuit = null;
      for (const [s, c] of Object.entries(suitFreq)) {
        if (c > suitedCount) { suitedCount = c; flushSuit = s; }
      }
      result.suitedCount = suitedCount;
      result.flushSuit = flushSuit;
      result.flushPossible = suitedCount >= 3;
      const uniqueVals = [...new Set(values)].sort((a, b) => a - b);
      for (let i = 0; i < uniqueVals.length - 2; i++) {
        if (uniqueVals[i + 2] - uniqueVals[i] <= 4) { result.straightPossible = true; break; }
      }
      let wet = 0;
      if (result.flushPossible) wet += 0.35;
      if (result.straightPossible) wet += 0.35;
      if (result.paired) wet += 0.15;
      if (suitedCount === 4) wet += 0.15;
      result.wet = Math.min(1, wet);
      return result;
    }
  };

  const Bots = {
    CLASS_PRO: null,
    CLASS_VIP,
    TYPES,
    PROFILES,
    Texture: VipTexture,
    decidePreflop,
    decidePostflop,
    decide,
    assignBotTypes,
    assignBotsToSeats,
    preflopStrength,
    postflopStrength,
    handInChart,
    updateModel,
    updateMeta,
    getRead,
    reset,
    dumpStats,
    getProfile,
    getTypeMeta
  };

  Bots.__level = 'default';
  Bots.__version = '1.0-vip';
  Bots.__source = 'index.html';

  return Bots;

})();

window.VipBots = VipBots;
window.Bots = VipBots;
</script>
