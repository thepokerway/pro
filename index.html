    if (next === 0) { stopHeroTimer(); UI.setHeroTimerIdle(); }
    else {
      if (session.waitingForHero && !session.heroEliminated) startHeroTimerIfNeeded();
      else UI.setHeroTimerReady();
    }
  }

  function refreshCallAmount() {
    const state = session.state;
    if (!state) return;
    const hero = state.players[session.heroIndex];
    if (!hero) return;
    const handlers = window.__heroHandlers;
    if (handlers) UI.updateCallButton(state, hero, handlers);
  }

  function bindSeatStackAndCardsTap() {
    if (!el.seats) return;
    el.seats.addEventListener('touchend', (e) => {
      if (e.target.closest('.hero-timer-zone')) return;
      if (e.target.closest('.dealer-chip')) return;
      const stackEl = e.target.closest('.stack');
      if (stackEl) {
        e.stopPropagation(); e.preventDefault();
        handleStackTap();
        return;
      }
      const heroCardsEl = e.target.closest('.seat.hero .seat-cards');
      if (heroCardsEl) {
        e.stopPropagation(); e.preventDefault();
        handleHeroCardsTapToggleHero();
        return;
      }
      const cardsEl = e.target.closest('.seat-cards');
      if (cardsEl) {
        e.stopPropagation(); e.preventDefault();
        handleBotCardsTapToggleAll();
        return;
      }
    }, { passive: false });

    el.seats.addEventListener('click', (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      if (e.target.closest('.hero-timer-zone')) return;
      if (e.target.closest('.dealer-chip')) return;
      const stackEl = e.target.closest('.stack');
      if (stackEl) {
        e.stopPropagation(); e.preventDefault();
        handleStackTap();
        return;
      }
      const heroCardsEl = e.target.closest('.seat.hero .seat-cards');
      if (heroCardsEl) {
        e.stopPropagation(); e.preventDefault();
        handleHeroCardsTapToggleHero();
        return;
      }
      const cardsEl = e.target.closest('.seat-cards');
      if (cardsEl) {
        e.stopPropagation(); e.preventDefault();
        handleBotCardsTapToggleAll();
        return;
      }
    });
  }
  
  function handleStackTap() {
    UI.toggleStackDisplay();
    if (session.replay.active) { renderReplayStep(); return; }
    if (session.state) {
      const state = session.state;
      const showAll = state.handOver || session.viewingIndex >= 0;
      if (session.viewingIndex >= 0) {
        UI.updateSeats(session.history[session.viewingIndex], true);
        UI.updatePot(session.history[session.viewingIndex]);
      } else {
        UI.updateSeats(state, showAll);
        UI.updatePot(state);
      }
      UI.updateLevel(session.viewingIndex >= 0 ? session.history[session.viewingIndex] : state);
      if (session.viewingIndex < 0 && session.waitingForHero) {
        refreshQuickPercentList();
        refreshCallAmount();
        UI.rebindPercentButtonHandlers();
      }
    }
  }

  function handleHeroCardsTapToggleHero() {
    UI.toggleHideHeroHand();
    if (session.replay.active) { renderReplayStep(); return; }
    if (session.state) {
      const state = session.state;
      const showAll = state.handOver || session.viewingIndex >= 0;
      if (session.viewingIndex >= 0) UI.updateSeats(session.history[session.viewingIndex], true);
      else UI.updateSeats(state, showAll);
    }
  }

  function handleBotCardsTapToggleAll() {
    UI.toggleShowAllHands();
    if (session.replay.active) { renderReplayStep(); return; }
    if (session.state) {
      const state = session.state;
      const showAll = state.handOver || session.viewingIndex >= 0;
      if (session.viewingIndex >= 0) UI.updateSeats(session.history[session.viewingIndex], true);
      else UI.updateSeats(state, showAll);
    }
  }

  function restartSession() {
    stopReplay(true);
    stopHeroTimer();
    clearTimeout(session.autoNextTimerId);
    clearTimeout(session.botTimerId);
    clearTimeout(session.revealTimerId);
    clearTimeout(session.streetEndTimerId);
    clearStreetRevealTimers();
    session.streetEndTimerId = null;
    session.active = false;
    session.state = null;
    session.history = [];
    session.viewingIndex = -1;
    session.waitingForHero = false;
    session.heroEliminated = false;
    session.heroFinishPlace = 0;
    session.tournamentOver = false;
    session.isPaused = false;
    session.finalShown = false;
    session.replay.pausedByWindow = false;
    session.huAutoActive = false;

    applyPendingBotsLevelOnRestart();

    UI.resetSeatAssignments();

    UI.hideFinalOverlay();
    UI.cancelFinalAutoReload();
    UI.setHeroActionsActive(false);
    UI.updateHistoryInfo(0, 0, false);
    UI.clearWinnerHighlights();
    UI.setReplayButtonState('replay');
    UI.applyDealerChipIndicator();

    syncHistoryFlags();
    UI.setHeroTimerZoneEnabled(true);
    UI.setHeroTimerReady();
    updateHuGlowFromState();

    startNewSession();
  }

  function startNewSession() {
    stopReplay(true);
    stopHeroTimer();
    clearTimeout(session.autoNextTimerId);
    clearTimeout(session.botTimerId);
    clearTimeout(session.revealTimerId);
    clearTimeout(session.streetEndTimerId);
    clearStreetRevealTimers();
    session.streetEndTimerId = null;
    session.active = true;
    session.waitingForHero = false;
    session.heroEliminated = false;
    session.heroFinishPlace = 0;
    session.tournamentOver = false;
    session.history = [];
    session.viewingIndex = -1;
    session.isPaused = false;
    session.finalShown = false;
    session.replay.pausedByWindow = false;
    session.huAutoActive = false;

    UI.resetSeatAssignments();
    UI.applyDealerChipIndicator();

    const activeBots = getActiveBots();
    const botTypes = activeBots.assignBotTypes();
    const shuffledTypes = activeBots.assignBotsToSeats(botTypes);

    const players = [{ id: 'hero', name: 'Hero', isHero: true, botType: null, botClass: null, stack: Engine.STARTING_STACK }];
    for (let i = 0; i < 7; i++) {
      const t = activeBots.TYPES[shuffledTypes[i]];
      players.push({
        id: 'bot' + (i + 1),
        name: 'Player_' + (i + 1),
        isHero: false,
        botType: shuffledTypes[i],
        botClass: t ? t.cls : null,
        stack: Engine.STARTING_STACK
      });
    }

    session.heroIndex = 0;
    session.state = Engine.createInitialState(players);
    session.state.buttonIndex = Engine.cryptoRandomInt(8);

    UI.renderTable(session.state);
    UI.updateHistoryInfo(0, 0, false);
    UI.setReplayButtonState('replay');

    syncHistoryFlags();
    UI.setHeroTimerZoneEnabled(true);
    UI.setHeroTimerReady();
    updateHuGlowFromState();

    startHand();
  }

  function startHand() {
    if (!session.active) return;
    stopReplay(true);
    stopHeroTimer();
    clearTimeout(session.streetEndTimerId);
    clearStreetRevealTimers();
    session.streetEndTimerId = null;

    if (session.tournamentOver) return;

    for (const p of session.state.players) {
      if (!p.eliminated && p.stack <= 0) p.eliminated = true;
    }

    const hero = session.state.players[session.heroIndex];
    if (hero.eliminated && !session.heroEliminated) session.heroEliminated = true;

    const alive = session.state.players.filter(p => !p.eliminated);
    if (alive.length <= 1) {
      session.tournamentOver = true;
      UI.setHeroActionsActive(false);
      UI.setHeroTimerIdle();
      UI.updatePlaceCenter(session.state);
      handleTournamentEnd(alive);
      return;
    }

    clearTimeout(session.revealTimerId);
    Engine.startHand(session.state);
    session.viewingIndex = -1;
    session.isPaused = false;

    UI.clearWinnerHighlights();
    UI.renderTable(session.state);
    UI.updateBoard(session.state);
    UI.updatePot(session.state);
    UI.updateSeats(session.state);
    UI.updateLevel(session.state);
    UI.updatePlaceCenter(session.state);
    UI.updateBoardAreaOffset();
    UI.alignPercentBlockBottom();
    UI.updateHistoryInfo(session.history.length, session.history.length, false);

    UI.resetSliderToStart();
    refreshQuickPercentList();
    UI.setHeroActionsActive(false);
    UI.setHeroTimerZoneEnabled(true);
    UI.setHeroTimerReady();

    syncHistoryFlags();
    checkHuAutoActivation();

    processTurn();
  }

  let botTournamentReloadTimer = null;

  function handleTournamentEnd(alive) {
    if (session.finalShown) return;
    session.finalShown = true;
    const winner = alive[0];
    const heroIsWinner = winner && winner.isHero;
    if (heroIsWinner) UI.showWinnerFinal();
    else {
      if (botTournamentReloadTimer) clearTimeout(botTournamentReloadTimer);
      botTournamentReloadTimer = setTimeout(() => window.location.reload(), 60 * 1000);
    }
  }

  function refreshQuickPercentList() {
    const state = session.state;
    if (!state) return;
    const hero = state.players[session.heroIndex];
    if (!hero) return;
    const toCall = Math.max(0, state.currentBet - hero.committedThisStreet);
    UI.renderQuickRaiseOptions(state, hero, toCall, null);
    UI.alignPercentBlockBottom();
  }

  function processTurn() {
    if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
    const state = session.state;
    if (!state) return;
    if (state.handOver) { finishHand(); return; }

    const idx = state.actingIndex;
    const player = state.players[idx];
    if (!player || player.folded || player.eliminated || player.allIn) { advanceOrFinish(); return; }

    UI.updateActiveHighlight(state);

    if (player.isHero && !session.heroEliminated) {
      session.waitingForHero = true;
      heroTurn();
    } else {
      session.waitingForHero = false;
      UI.setHeroActionsActive(false);
      const seconds = Number(UI.settings.turnTime) || 0;
      if (seconds > 0) UI.setHeroTimerReady();
      else UI.setHeroTimerIdle();
      UI.resetSliderToStart();
      refreshQuickPercentList();
      botTurn(player, idx);
    }
  }
  
  function heroTurn() {
    const state = session.state;
    UI.showActions(state, session.heroIndex, {
      onFold:  () => heroAct({ type: 'fold' }),
      onCheck: () => heroAct({ type: 'check' }),
      onCall:  () => heroAct({ type: 'call' }),
      onBet:   (amount) => heroAct({ type: 'bet', amount }),
      onRaise: (amount) => heroAct({ type: 'raise', amount }),
      onAllIn: () => heroAct({ type: 'allin' })
    });
    startHeroTimerIfNeeded();
    UI.alignPercentBlockBottom();
  }

  function startHeroTimerIfNeeded() {
    stopHeroTimer();
    const seconds = Number(UI.settings.turnTime) || 0;
    if (seconds <= 0) { UI.setHeroTimerIdle(); return; }
    session.heroTimerTotal = seconds;
    session.heroTimerRemaining = seconds;
    UI.showHeroTimer(seconds);
    session.heroTimerIntervalId = setInterval(() => {
      session.heroTimerRemaining -= 1;
      UI.updateHeroTimer(session.heroTimerRemaining, session.heroTimerTotal);
      if (session.heroTimerRemaining < 0) {
        stopHeroTimer();
        const s = Number(UI.settings.turnTime) || 0;
        if (s > 0) UI.setHeroTimerReady();
        else UI.setHeroTimerIdle();
        if (session.waitingForHero && !session.heroEliminated) {
          session.waitingForHero = false;
          UI.setHeroActionsActive(false);
          UI.resetSliderToStart();
          const state = session.state;
          if (state) {
            const res = Engine.applyAction(state, session.heroIndex, { type: 'fold' });
            if (res.ok) {
              pushActionLog(state, session.heroIndex, 'fold', 0);
              UI.updateSeats(state);
              UI.updatePot(state);
            }
            UI.clearActiveHighlight();
            advanceOrFinish();
          }
        }
      }
    }, 1000);
  }

  function stopHeroTimer() {
    if (session.heroTimerIntervalId) { clearInterval(session.heroTimerIntervalId); session.heroTimerIntervalId = null; }
    session.heroTimerRemaining = 0;
  }

  function heroAct(action) {
    if (session.viewingIndex >= 0 || session.replay.active || !session.waitingForHero) return;
    stopHeroTimer();
    session.waitingForHero = false;
    UI.setHeroActionsActive(false);
    UI.resetSliderToStart();
    const state = session.state;
    const heroBefore = state.players[session.heroIndex];
    const stackBefore = heroBefore.stack;
    const potBefore = state.pot;
    const quickOptions = Array.from(el.quickPercentList ? el.quickPercentList.querySelectorAll('button') : []).map(b => {
      const label = b.querySelector('.label') ? b.querySelector('.label').textContent : '';
      const val = b.querySelector('.value') ? b.querySelector('.value').textContent : '';
      return label + '=' + val;
    });
    const res = Engine.applyAction(state, session.heroIndex, action);
    if (!res.ok) { session.waitingForHero = true; heroTurn(); return; }
    const heroCtx = {
      street: state.street,
      action: action.type,
      amount: action.amount || 0,
      potBefore,
      potAfter: state.pot,
      stackBefore,
      stackAfter: heroBefore.stack,
      committedThisStreet: heroBefore.committedThisStreet,
      committedTotal: heroBefore.committedTotal,
      quickOptions
    };
    pushActionLog(state, session.heroIndex, action.type, action.amount || 0, { heroCtx });
    UI.updateSeats(state);
    UI.updatePot(state);
    UI.clearActiveHighlight();
    const s = Number(UI.settings.turnTime) || 0;
    if (s > 0) UI.setHeroTimerReady();
    else UI.setHeroTimerIdle();
    advanceOrFinish();
  }

  function decideBotAction(bot, ctx) {
    const activeBots = getActiveBots();
    const isPreflop = ctx.street === 'preflop';
    let result;
    try {
      if (isPreflop && typeof activeBots.decidePreflop === 'function') {
        result = activeBots.decidePreflop(ctx);
      } else if (!isPreflop && typeof activeBots.decidePostflop === 'function') {
        result = activeBots.decidePostflop(ctx);
      } else if (typeof activeBots.decide === 'function') {
        result = activeBots.decide(ctx);
      } else {
        result = { action: 'fold', amount: 0 };
      }
    } catch (err) {
      try {
        window.__ppErrors.push({
          ts: Date.now(),
          kind: 'bot-decision-error',
          message: err && err.message ? String(err.message) : String(err),
          stack: err && err.stack ? String(err.stack) : '',
          botType: bot.botType
        });
      } catch (e) {}
      result = { action: 'fold', amount: 0 };
    }
    if (!result || typeof result !== 'object') result = { action: 'fold', amount: 0 };
    return result;
  }

  function botTurn(bot, idx) {
    const state = session.state;
    clearTimeout(session.botTimerId);
    session.botTimerId = setTimeout(() => {
      if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
      if (state.handOver || !session.active) return;
      const ctx = buildBotContext(bot, idx);
      const result = decideBotAction(bot, ctx);
      const toCall = Math.max(0, state.currentBet - bot.committedThisStreet);
      let engineAction = { type: result.action, amount: result.amount || 0 };
      if (engineAction.type === 'check' && toCall > 0) engineAction = { type: 'fold', amount: 0 };
      if (engineAction.type === 'bet' && state.currentBet > 0) engineAction.type = 'raise';
      if (engineAction.type === 'raise') {
        const minTarget = state.currentBet + state.minRaise;
        const maxTarget = bot.committedThisStreet + bot.stack;
        let target = engineAction.amount;
        if (target < minTarget) target = minTarget;
        if (target > maxTarget) target = maxTarget;
        if (target <= state.currentBet) engineAction = toCall > 0 ? { type: 'call', amount: toCall } : { type: 'check', amount: 0 };
        else engineAction.amount = target;
      }
      if (engineAction.type === 'bet') {
        const maxTarget = bot.committedThisStreet + bot.stack;
        let target = engineAction.amount;
        if (target <= 0) target = state.blinds.bb;
        if (target > maxTarget) target = maxTarget;
        engineAction.amount = target;
      }
      const res = Engine.applyAction(state, idx, engineAction);
      if (!res.ok) {
        const fallback = toCall > 0 ? { type: 'fold' } : { type: 'check' };
        Engine.applyAction(state, idx, fallback);
        engineAction = fallback;
      }
      const botCtx = buildBotLogCtx(bot, ctx, engineAction, result);
      pushActionLog(state, idx, engineAction.type, engineAction.amount || 0, { botCtx });
      UI.updateSeats(state);
      UI.updatePot(state);
      UI.clearActiveHighlight();
      refreshQuickPercentList();
      advanceOrFinish();
    }, 1000);
  }

  function buildBotContext(bot, idx) {
    const state = session.state;
    const toCall = Math.max(0, state.currentBet - bot.committedThisStreet);
    const raiser = state.lastAggressorIndex !== null ? state.players[state.lastAggressorIndex] : null;
    let facingRaise;
    if (state.street === 'preflop') facingRaise = state.currentBet > state.blinds.bb;
    else facingRaise = state.currentBet > 0;
    const facing3Bet = state.street === 'preflop' && state.currentBet > state.blinds.bb * 3;
    const facingAllin = state.players.some(p => p !== bot && !p.folded && p.allIn && p.committedThisStreet >= state.currentBet);
    let oppLastAction = null, oppPosition = null, oppStackBB = 0;
    if (raiser) {
      oppPosition = raiser.position;
      oppStackBB = raiser.stack / state.blinds.bb;
      oppLastAction = raiser.lastAction;
    }
    const alive = state.players.filter(p => !p.eliminated);
    const isAggressor = state.lastAggressorIndex === idx;
    return {
      card1: bot.holeCards[0], card2: bot.holeCards[1], board: state.board,
      street: state.street, pot: state.pot, toCall, minRaise: state.minRaise,
      currentBet: state.currentBet,
      myStack: bot.stack, bb: state.blinds.bb, position: bot.position,
      numActive: state.players.filter(p => !p.folded && !p.eliminated).length,
      facingRaise, facing3Bet, facingAllin,
      raiserPosition: raiser ? raiser.position : null,
      botType: bot.botType, botId: bot.id, playersLeft: alive.length,
      oppLastAction, oppPosition, oppStackBB,
      isAggressor
    };
  }

  function buildBotLogCtx(bot, ctx, finalAction, botResult) {
    const state = session.state;
    const activeBots = getActiveBots();
    const prof = activeBots.PROFILES[bot.botType] || null;
    const allCards = [...bot.holeCards, ...state.board];
    const handScore = allCards.length >= 5 ? Engine.evaluateHand(allCards) : null;
    const diagnostics = (botResult && botResult.diagnostics) ? botResult.diagnostics : null;
    const reasonParts = [];
    reasonParts.push('action: ' + finalAction.type + (finalAction.amount ? ' ' + finalAction.amount : ''));
    if (diagnostics && diagnostics.reason) reasonParts.push(diagnostics.reason);
    const reason = reasonParts.join(' | ');
    return {
      botType: bot.botType,
      botClass: bot.botClass,
      position: bot.position,
      stackBB: bot.stack / state.blinds.bb,
      numActive: ctx.numActive,
      street: state.street,
      pot: state.pot,
      toCall: ctx.toCall,
      minRaise: state.minRaise,
      currentBet: state.currentBet,
      myStack: bot.stack,
      committedThisStreet: bot.committedThisStreet,
      committedTotal: bot.committedTotal,
      holeCards: bot.holeCards,
      board: state.board,
      handName: handScore ? handScore.name : '—',
      isAggressor: ctx.isAggressor,
      profile: prof ? {
        aggression: prof.aggression,
        looseness: prof.looseness,
        bluff: prof.bluff,
        callThreshold: prof.callThreshold
      } : null,
      diagnostics,
      reason
    };
  }

  function pushActionLog(state, playerIndex, actionType, amount, extra) {
    if (!state.actionLog) state.actionLog = [];
    const entry = { playerIndex, actionType, amount: amount || 0, street: state.street, potAfter: state.pot };
    if (extra && extra.botCtx) entry.botCtx = extra.botCtx;
    if (extra && extra.heroCtx) entry.heroCtx = extra.heroCtx;
    state.actionLog.push(entry);
  }

  function advanceOrFinish() {
    if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
    const state = session.state;
    if (state.handOver) { finishHand(); return; }

    if (Engine.isBettingRoundComplete(state)) {
      if (session.streetEndTimerId !== null) return;
      session.streetEndTimerId = setTimeout(() => {
        session.streetEndTimerId = null;
        if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
        const res = Engine.endBettingRound(state);
        const timerId = setTimeout(() => {
          if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
          UI.updateBoard(state);
          UI.updatePot(state);
          UI.updateSeats(state);
          refreshQuickPercentList();
          if (res.done) { finishHand(); return; }
          UI.updateActiveHighlight(state);
          checkHuAutoActivation();
          processTurn();
        }, 1000);
        session.streetRevealTimers.push(timerId);
      }, 0);
      return;
    }

    const next = Engine.nextActor(state);
    if (next < 0) {
      if (session.streetEndTimerId !== null) return;
      session.streetEndTimerId = setTimeout(() => {
        session.streetEndTimerId = null;
        if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
        const res = Engine.endBettingRound(state);
        const timerId = setTimeout(() => {
          if (session.isPaused || session.viewingIndex >= 0 || session.replay.active) return;
          UI.updateBoard(state);
          UI.updatePot(state);
          UI.updateSeats(state);
          refreshQuickPercentList();
          if (res.done) { finishHand(); return; }
          UI.updateActiveHighlight(state);
          checkHuAutoActivation();
          processTurn();
        }, 1000);
        session.streetRevealTimers.push(timerId);
      }, 0);
      return;
    }
    state.actingIndex = next;
    processTurn();
  }
  
  function finishHand() {
    if (session.isPaused || session.replay.active) return;
    stopHeroTimer();
    const s = Number(UI.settings.turnTime) || 0;
    if (s > 0) UI.setHeroTimerReady();
    else UI.setHeroTimerIdle();
    const state = session.state;
    Engine.finalizeHand(state);

    const snapForModel = {
      players: state.players.map(p => ({
        id: p.id, seatIndex: p.seatIndex, name: p.name, isHero: p.isHero,
        botType: p.botType, botClass: p.botClass, stack: p.stack, position: p.position,
        holeCards: p.holeCards.map(c => ({ ...c })),
        folded: p.folded, eliminated: p.eliminated, revealed: p.revealed,
        acted: p.acted, lastAction: p.lastAction,
        committedTotal: p.committedTotal, blindPaid: p.blindPaid,
        inHand: p.inHand
      })),
      handOver: state.handOver,
      showdownResults: state.showdownResults,
      actionLog: (state.actionLog || []).map(a => ({ ...a }))
    };

    const activeBots = getActiveBots();
    for (const p of state.players) {
      if (!p.botType) continue;
      try { if (typeof activeBots.updateModel === 'function') activeBots.updateModel(p.id, snapForModel); } catch (e) {}
      try {
        const prof = activeBots.PROFILES[p.botType];
        if (prof && typeof activeBots.updateMeta === 'function') activeBots.updateMeta(p.id, prof);
      } catch (e) {}
    }

    session.history.push(snapshotState(state));
    if (session.history.length > 1000) session.history.shift();

    const heroP = state.players[session.heroIndex];
    if (heroP.eliminated || heroP.stack <= 0) {
      if (!session.heroEliminated) {
        const aliveAfter = state.players.filter(p => !p.eliminated).length;
        session.heroEliminated = true;
        session.heroFinishPlace = aliveAfter + 1;
        heroP.heroFinishPlace = session.heroFinishPlace;
      }
    }

    UI.updateBoard(state);
    UI.updateSeats(state, false);
    UI.updatePot(state);
    UI.updateActiveHighlight(state);
    UI.updatePlaceCenter(state);
    UI.updateBoardAreaOffset();
    UI.setHeroActionsActive(false);
    UI.resetSliderToStart();
    refreshQuickPercentList();
    UI.updateHistoryInfo(session.history.length, session.history.length, false);
    highlightWinners(state);

    clearTimeout(session.revealTimerId);
    session.revealTimerId = setTimeout(() => {
      if (!session.state || session.state !== state) return;
      if (!state.handOver) return;
      if (session.viewingIndex >= 0 || session.replay.active) return;
      UI.updateSeats(state, true);
      UI.updateBoard(state);
      UI.updatePlaceCenter(state);
      UI.updateBoardAreaOffset();
      UI.alignPercentBlockBottom();
    }, 1000);

    clearTimeout(session.autoNextTimerId);
    session.autoNextTimerId = setTimeout(() => {
      if (!session.active || session.viewingIndex >= 0) return;
      if (session.isPaused || session.replay.active) return;
      clearPendingOnHandEnd();
      const period = UI.settings.blindGrowthHands || 10;
      state.handsAtLevel++;
      if (state.handsAtLevel >= period) {
        state.handsAtLevel = 0;
        state.levelIndex = Math.min(state.levelIndex + 1, Engine.BLIND_LEVELS.length - 1);
      }
      const alive = state.players.filter(p => !p.eliminated);
      if (alive.length <= 1) {
        session.tournamentOver = true;
        UI.setHeroActionsActive(false);
        UI.setHeroTimerIdle();
        UI.updatePlaceCenter(state);
        UI.updateBoardAreaOffset();
        handleTournamentEnd(alive);
        return;
      }
      startHand();
    }, 4000);
  }

  function highlightWinners(state) {
    UI.clearWinnerHighlights();
    if (!state.showdownResults) return;
    for (const [id, amount] of Object.entries(state.showdownResults.payouts || {})) {
      if (amount <= 0) continue;
      const seat = document.getElementById(`seat-${id}`);
      if (seat) seat.classList.add('winner');
    }
  }

  function snapshotState(state) {
    return {
      handNumber: state.handNumber,
      levelIndex: state.levelIndex,
      handOver: state.handOver,
      finalStreet: state.finalStreet,
      board: state.board.map(c => ({ ...c })),
      pot: state.pot,
      buttonIndex: state.buttonIndex,
      blinds: { ...state.blinds },
      players: state.players.map(p => ({
        id: p.id, seatIndex: p.seatIndex, name: p.name, isHero: p.isHero,
        botType: p.botType, botClass: p.botClass, stack: p.stack, position: p.position,
        holeCards: p.holeCards.map(c => ({ ...c })),
        folded: p.folded, eliminated: p.eliminated, revealed: p.revealed,
        committedThisStreet: 0, acted: p.acted, lastAction: p.lastAction,
        committedTotal: p.committedTotal, blindPaid: p.blindPaid,
        inHand: p.inHand, heroFinishPlace: p.heroFinishPlace || 0
      })),
      showdownResults: state.showdownResults,
      actionLog: (state.actionLog || []).map(a => ({ ...a }))
    };
  }

  function pauseGame() {
    if (session.isPaused) return;
    session.isPaused = true;
    clearTimeout(session.botTimerId);
    clearTimeout(session.autoNextTimerId);
    clearTimeout(session.streetEndTimerId);
    clearStreetRevealTimers();
    session.botTimerId = null;
    session.autoNextTimerId = null;
    session.streetEndTimerId = null;
    UI.setHeroActionsActive(false);
    stopHeroTimer();
    if (!window.__sessionShowHistoryLabel) {
      const s = Number(UI.settings.turnTime) || 0;
      if (s > 0) UI.setHeroTimerReady();
      else UI.setHeroTimerIdle();
    }
  }

  function navigateHistory(delta) {
    if (session.history.length === 0) return;
    stopReplay(true);
    if (session.viewingIndex < 0) {
      session.viewingIndex = session.history.length - 1;
      pauseGame();
    } else {
      session.viewingIndex = Math.max(0, Math.min(session.history.length - 1, session.viewingIndex + delta));
    }
    syncHistoryFlags();
    renderHistorySnapshot();
    UI.applyDealerChipIndicator();
  }

  function renderHistorySnapshot() {
    const snap = session.history[session.viewingIndex];
    if (!snap) return;
    UI.setHeroActionsActive(false);
    UI.setHeroTimerOff();
    UI.renderTable(snap);
    UI.updateBoard(snap);
    UI.updateSeats(snap, true);
    UI.updatePot(snap);
    UI.updateLevel(snap);
    UI.updateActiveHighlight({ actingIndex: -1, handOver: true, players: snap.players });
    highlightWinners(snap);
    UI.updateHistoryInfo(session.viewingIndex + 1, session.history.length, true);
    UI.setReplayButtonState('replay');
    UI.setHeroTimerOff();
    updateHistoryCopyAppearance();
    updateRestartButtonAppearance();
    UI.applyDealerChipIndicator();
  }

  function buildReplaySteps(snap) {
    const steps = [];
    const finalBoard = snap.board || [];
    const actionLog = snap.actionLog || [];
    const payouts = (snap.showdownResults && snap.showdownResults.payouts) || {};
    const baseStacks = {};
    for (const p of snap.players) {
      const payout = payouts[p.id] || 0;
      baseStacks[p.id] = p.stack + (p.committedTotal || 0) - payout;
    }
    const cur = {
      board: [], pot: 0,
      players: snap.players.map(p => ({
        id: p.id, seatIndex: p.seatIndex, name: p.name, isHero: p.isHero,
        botType: p.botType, botClass: p.botClass, position: p.position,
        holeCards: p.holeCards.map(c => ({ ...c })),
        stack: baseStacks[p.id],
        committedThisStreet: 0, committedTotal: 0,
        folded: false, allIn: false,
        eliminated: !!p.eliminated, inHand: !!p.inHand,
        acted: false, lastAction: null, revealed: false, blindPaid: 0,
        heroFinishPlace: p.heroFinishPlace || 0
      }))
    };
    let sbIdxForReplay = -1, bbIdxForReplay = -1;
    (function applyReplayBlinds() {
      const n = cur.players.length;
      if (n === 0) return;
      const aliveIdx = [];
      for (let i = 0; i < n; i++) if (!cur.players[i].eliminated && cur.players[i].inHand) aliveIdx.push(i);
      if (aliveIdx.length < 2) return;
      const btnIdx = (typeof snap.buttonIndex === 'number') ? snap.buttonIndex : 0;
      const nextAliveAfter = (startIdx) => {
        for (let step = 1; step <= n; step++) {
          const idx = (startIdx + step) % n;
          if (!cur.players[idx].eliminated && cur.players[idx].inHand) return idx;
        }
        return -1;
      };
      if (aliveIdx.length === 2) {
        sbIdxForReplay = btnIdx;
        if (cur.players[sbIdxForReplay].eliminated || !cur.players[sbIdxForReplay].inHand) sbIdxForReplay = nextAliveAfter(btnIdx);
        bbIdxForReplay = nextAliveAfter(sbIdxForReplay);
      } else {
        sbIdxForReplay = nextAliveAfter(btnIdx);
        if (sbIdxForReplay < 0) return;
        bbIdxForReplay = nextAliveAfter(sbIdxForReplay);
      }
      if (sbIdxForReplay < 0 || bbIdxForReplay < 0 || sbIdxForReplay === bbIdxForReplay) {
        sbIdxForReplay = -1; bbIdxForReplay = -1;
        return;
      }
      const sbAmount = (snap.blinds && snap.blinds.sb) || 0;
      const bbAmount = (snap.blinds && snap.blinds.bb) || 0;
      const sbPlayer = cur.players[sbIdxForReplay];
      const sbPay = Math.min(sbAmount, sbPlayer.stack);
      if (sbPay > 0) {
        sbPlayer.stack -= sbPay;
        sbPlayer.committedThisStreet += sbPay;
        sbPlayer.committedTotal += sbPay;
        sbPlayer.blindPaid = sbPay;
        sbPlayer.lastAction = 'sb';
        cur.pot += sbPay;
        if (sbPlayer.stack === 0) sbPlayer.allIn = true;
      }
      const bbPlayer = cur.players[bbIdxForReplay];
      const bbPay = Math.min(bbAmount, bbPlayer.stack);
      if (bbPay > 0) {
        bbPlayer.stack -= bbPay;
        bbPlayer.committedThisStreet += bbPay;
        bbPlayer.committedTotal += bbPay;
        bbPlayer.blindPaid = bbPay;
        bbPlayer.lastAction = 'bb';
        cur.pot += bbPay;
        if (bbPlayer.stack === 0) bbPlayer.allIn = true;
      }
    })();
    
    const boardDeal = { preflop: 0, flop: 3, turn: 4, river: 5 };
    const takeBoardSnapshot = (street) => {
      const needed = boardDeal[street] || 0;
      while (cur.board.length < needed) {
        const idx = cur.board.length;
        if (idx < finalBoard.length) cur.board.push({ ...finalBoard[idx] });
        else break;
      }
    };
    const resetStreetCommits = () => { for (const p of cur.players) p.committedThisStreet = 0; };
    const computeFirstActorOnStreet = (street) => {
      const n = cur.players.length;
      if (n === 0) return -1;
      const isAliveInHand = (p) => !p.eliminated && p.inHand;
      const nextAliveAfter = (startIdx) => {
        for (let step = 1; step <= n; step++) {
          const idx = (startIdx + step) % n;
          if (isAliveInHand(cur.players[idx])) return idx;
        }
        return -1;
      };
      const aliveCount = cur.players.filter(isAliveInHand).length;
      if (street === 'preflop') {
        if (aliveCount === 2) {
          if (sbIdxForReplay >= 0) return sbIdxForReplay;
          return nextAliveAfter(bbIdxForReplay >= 0 ? bbIdxForReplay : 0);
        }
        if (bbIdxForReplay >= 0) return nextAliveAfter(bbIdxForReplay);
        return -1;
      }
      if (aliveCount === 2) {
        if (bbIdxForReplay >= 0) return bbIdxForReplay;
        if (sbIdxForReplay >= 0) return nextAliveAfter(sbIdxForReplay);
        return -1;
      }
      const btnIdx = (typeof snap.buttonIndex === 'number') ? snap.buttonIndex : 0;
      return nextAliveAfter(btnIdx);
    };

    const actedThisStreet = new Set();
    const findCurrentActorSeat = (fromSeatExclusive, currentBet) => {
      const n = cur.players.length;
      if (n === 0) return -1;
      for (let step = 1; step <= n; step++) {
        const idx = (fromSeatExclusive + step) % n;
        const p = cur.players[idx];
        if (p.eliminated || !p.inHand) continue;
        if (p.folded || p.allIn) continue;
        if (!actedThisStreet.has(p.seatIndex)) return p.seatIndex;
        if (p.committedThisStreet < currentBet) return p.seatIndex;
      }
      return -1;
    };

    let lastStreet = 'preflop';
    let replayCurrentBet = 0;
    takeBoardSnapshot(lastStreet);
    actedThisStreet.clear();
    let currentActorSeat = computeFirstActorOnStreet('preflop');
    steps.push({ kind: 'start', snapshot: makeReplaySnapshot(cur, snap, 'preflop', false, currentActorSeat) });

    for (const act of actionLog) {
      if (act.street !== lastStreet) {
        lastStreet = act.street;
        resetStreetCommits();
        replayCurrentBet = 0;
        takeBoardSnapshot(lastStreet);
        for (const p of cur.players) if (p.lastAction !== 'fold' && p.lastAction !== 'allin') p.lastAction = null;
        actedThisStreet.clear();
        currentActorSeat = computeFirstActorOnStreet(lastStreet);
        steps.push({ kind: 'street', snapshot: makeReplaySnapshot(cur, snap, lastStreet, false, currentActorSeat) });
      }
      const pl = cur.players.find(p => p.seatIndex === act.playerIndex);
      if (!pl) continue;
      const actionAmount = act.amount || 0;
      if (act.actionType === 'fold') { pl.folded = true; pl.lastAction = 'fold'; }
      else if (act.actionType === 'check') { pl.lastAction = 'check'; pl.acted = true; }
      else if (act.actionType === 'call') {
        const need = Math.max(0, replayCurrentBet - pl.committedThisStreet);
        if (need > 0) {
          const pay = Math.min(need, pl.stack);
          pl.stack -= pay; pl.committedThisStreet += pay; pl.committedTotal += pay; cur.pot += pay;
          if (pl.stack === 0) pl.allIn = true;
        }
        pl.lastAction = 'call'; pl.acted = true;
      } else if (act.actionType === 'bet') {
        const target = actionAmount;
        const need = Math.max(0, target - pl.committedThisStreet);
        const pay = Math.min(need, pl.stack);
        pl.stack -= pay; pl.committedThisStreet += pay; pl.committedTotal += pay; cur.pot += pay;
        if (pl.committedThisStreet > replayCurrentBet) replayCurrentBet = pl.committedThisStreet;
        pl.lastAction = 'bet'; pl.acted = true;
        if (pl.stack === 0) pl.allIn = true;
      } else if (act.actionType === 'raise') {
        const target = actionAmount;
        const need = Math.max(0, target - pl.committedThisStreet);
        const pay = Math.min(need, pl.stack);
        pl.stack -= pay; pl.committedThisStreet += pay; pl.committedTotal += pay; cur.pot += pay;
        if (pl.committedThisStreet > replayCurrentBet) replayCurrentBet = pl.committedThisStreet;
        pl.lastAction = 'raise'; pl.acted = true;
        if (pl.stack === 0) pl.allIn = true;
      } else if (act.actionType === 'allin') {
        const target = actionAmount;
        const need = Math.max(0, target - pl.committedThisStreet);
        const pay = Math.min(need, pl.stack);
        pl.stack -= pay; pl.committedThisStreet += pay; pl.committedTotal += pay; cur.pot += pay;
        if (pl.committedThisStreet > replayCurrentBet) replayCurrentBet = pl.committedThisStreet;
        pl.lastAction = 'allin'; pl.acted = true; pl.allIn = true;
      }
      actedThisStreet.add(pl.seatIndex);
      const nextSeat = findCurrentActorSeat(pl.seatIndex, replayCurrentBet);
      steps.push({ kind: 'action', snapshot: makeReplaySnapshot(cur, snap, lastStreet, false, nextSeat) });
      currentActorSeat = nextSeat;
    }

    while (cur.board.length < finalBoard.length) cur.board.push({ ...finalBoard[cur.board.length] });
    const finalSnap = JSON.parse(JSON.stringify(snap));
    finalSnap.handOver = true;
    finalSnap.replayActingIndex = -1;
    steps.push({ kind: 'final', snapshot: finalSnap });
    return steps;
  }

  function makeReplaySnapshot(cur, baseSnap, street, handOver, actingSeatIndex) {
    return {
      handNumber: baseSnap.handNumber,
      levelIndex: baseSnap.levelIndex,
      handOver: !!handOver,
      finalStreet: street || baseSnap.finalStreet,
      board: cur.board.map(c => ({ ...c })),
      pot: cur.pot,
      buttonIndex: baseSnap.buttonIndex,
      blinds: { ...baseSnap.blinds },
      replayActingIndex: (typeof actingSeatIndex === 'number') ? actingSeatIndex : -1,
      players: cur.players.map(p => ({
        id: p.id, seatIndex: p.seatIndex, name: p.name, isHero: p.isHero,
        botType: p.botType, botClass: p.botClass, stack: p.stack, position: p.position,
        holeCards: p.holeCards.map(c => ({ ...c })),
        folded: p.folded, eliminated: p.eliminated, revealed: p.revealed,
        committedThisStreet: p.committedThisStreet, acted: p.acted, lastAction: p.lastAction,
        committedTotal: p.committedTotal, blindPaid: p.blindPaid, inHand: p.inHand,
        heroFinishPlace: p.heroFinishPlace || 0
      })),
      showdownResults: null,
      actionLog: []
    };
  }

  function toggleReplay() {
    if (session.viewingIndex < 0) return;
    const snap = session.history[session.viewingIndex];
    if (!snap) return;
    if (!session.replay.active) { startReplay(snap); return; }
    if (session.replay.paused) { session.replay.pausedByWindow = false; resumeReplay(); }
    else pauseReplay();
    updateRestartButtonAppearance();
  }

  function startReplay(snap) {
    stopReplay(true);
    const steps = buildReplaySteps(snap);
    session.replay.active = true;
    session.replay.paused = false;
    session.replay.stepIndex = 0;
    session.replay.steps = steps;
    session.replay.handSnapshot = snap;
    session.replay.pausedByWindow = false;
    window.__replayActive = true;
    UI.setHeroActionsActive(false);
    UI.setHeroTimerOff();
    UI.setReplayButtonState('pause');
    syncHistoryFlags();
    renderReplayStep();
    scheduleNextReplayStep();
    updateRestartButtonAppearance();
  }

  function renderReplayStep() {
    const r = session.replay;
    if (!r.active) return;
    const step = r.steps[r.stepIndex];
    if (!step) return;
    const s = step.snapshot;
    UI.renderTable(s);
    UI.updateBoard(s);
    UI.updateSeats(s, false);
    UI.updatePot(s);
    UI.updateLevel(s);
    UI.updateActiveHighlight({ actingIndex: (typeof s.replayActingIndex === 'number' ? s.replayActingIndex : -1), handOver: !!s.handOver, players: s.players });
    if (s.handOver) highlightWinners(s);
    else UI.clearWinnerHighlights();
    UI.updateHistoryInfo(session.viewingIndex + 1, session.history.length, true);
    UI.setHeroTimerOff();
    updateHistoryCopyAppearance();
    updateRestartButtonAppearance();
  }

  function scheduleNextReplayStep() {
    const r = session.replay;
    if (!r.active || r.paused) return;
    clearTimeout(r.timerId);
    r.timerId = setTimeout(() => {
      if (!r.active || r.paused) return;
      r.stepIndex++;
      if (r.stepIndex >= r.steps.length) { finishReplay(); return; }
      renderReplayStep();
      scheduleNextReplayStep();
    }, 900);
  }

  function pauseReplay() {
    const r = session.replay;
    if (!r.active) return;
    r.paused = true;
    clearTimeout(r.timerId);
    r.timerId = null;
    UI.setReplayButtonState('play');
    updateRestartButtonAppearance();
  }

  function resumeReplay() {
    const r = session.replay;
    if (!r.active) return;
    r.paused = false;
    r.pausedByWindow = false;
    UI.setReplayButtonState('pause');
    scheduleNextReplayStep();
    updateRestartButtonAppearance();
  }

  function finishReplay() {
    const r = session.replay;
    r.active = false;
    r.paused = false;
    r.pausedByWindow = false;
    clearTimeout(r.timerId);
    r.timerId = null;
    r.steps = [];
    r.stepIndex = 0;
    window.__replayActive = false;
    UI.setReplayButtonState('replay');
    syncHistoryFlags();
    updateRestartButtonAppearance();
  }

  function stopReplay(restoreView) {
    const r = session.replay;
    if (r.timerId) clearTimeout(r.timerId);
    r.timerId = null;
    r.active = false;
    r.paused = false;
    r.pausedByWindow = false;
    r.steps = [];
    r.stepIndex = 0;
    r.handSnapshot = null;
    window.__replayActive = false;
    UI.setReplayButtonState('replay');
    if (restoreView && session.viewingIndex >= 0) renderHistorySnapshot();
    syncHistoryFlags();
    updateRestartButtonAppearance();
  }
  
  function resumeGame() {
    stopReplay(true);
    session.viewingIndex = -1;
    session.isPaused = false;
    const state = session.state;
    if (!state) return;
    UI.setHeroTimerZoneEnabled(true);
    const s = Number(UI.settings.turnTime) || 0;
    if (s > 0) UI.setHeroTimerReady();
    else UI.setHeroTimerIdle();
    syncHistoryFlags();

    if (state.handOver) {
      UI.updateBoard(state);
      UI.updateSeats(state, true);
      UI.updatePot(state);
      UI.updateLevel(state);
      UI.updatePlaceCenter(state);
      UI.updateBoardAreaOffset();
      UI.alignPercentBlockBottom();
      highlightWinners(state);
      UI.setHeroActionsActive(false);
      refreshQuickPercentList();
      if (session.autoNextTimerId === null) {
        session.autoNextTimerId = setTimeout(() => {
          if (!session.active || session.viewingIndex >= 0) return;
          if (session.isPaused || session.replay.active) return;
          clearPendingOnHandEnd();
          const period = UI.settings.blindGrowthHands || 10;
          state.handsAtLevel++;
          if (state.handsAtLevel >= period) {
            state.handsAtLevel = 0;
            state.levelIndex = Math.min(state.levelIndex + 1, Engine.BLIND_LEVELS.length - 1);
          }
          const alive = state.players.filter(p => !p.eliminated);
          if (alive.length <= 1) {
            session.tournamentOver = true;
            UI.setHeroActionsActive(false);
            UI.setHeroTimerIdle();
            UI.updatePlaceCenter(state);
            UI.updateBoardAreaOffset();
            handleTournamentEnd(alive);
            return;
          }
          startHand();
        }, 4000);
      }
    } else {
      UI.clearWinnerHighlights();
      UI.updateBoard(state);
      UI.updateSeats(state);
      UI.updatePot(state);
      UI.updateLevel(state);
      UI.updateActiveHighlight(state);
      UI.updatePlaceCenter(state);
      UI.updateBoardAreaOffset();
      UI.alignPercentBlockBottom();
      UI.resetSliderToStart();
      refreshQuickPercentList();
      if (session.waitingForHero && !session.heroEliminated) heroTurn();
      else { UI.setHeroActionsActive(false); processTurn(); }
    }
    UI.updateHistoryInfo(session.history.length, session.history.length, false);
    updateRestartButtonAppearance();
  }

  const _W = [84, 78, 120, 72, 80, 56, 116, 86, 90, 85, 70, 104, 70, 121, 65, 120, 71, 71, 116, 109, 75, 69, 113, 69, 109, 57, 67, 106, 104, 98, 99, 107, 51, 65];

  function decodeCodes(arr) {
    let s = '';
    for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
    return s;
  }
  function getWallet() { try { return decodeCodes(_W); } catch (e) { return ''; } }

  function buildDonateHtml() {
    const walletValue = getWallet();
    return (
      '<div class="donate-card-stack" id="donate-card-stack">' +
        '<div class="donate-card donate-card-gold" data-card="gold">' +
          '<div class="donate-card-top">' +
            '<div class="donate-card-type" translate="no">Cryptocurrency</div>' +
            '<div class="donate-card-club-top" translate="no">Tether</div>' +
          '</div>' +
          '<div class="donate-card-chip"></div>' +
          '<div class="donate-card-donate" translate="no">DONATE</div>' +
          '<div class="donate-card-usdt-line" translate="no">' +
            '<span class="donate-copy-text" data-copy-value="' + walletValue + '">' + walletValue + '<span class="donate-copy-icon"></span></span>' +
          '</div>' +
          '<div class="donate-card-bottom">' +
            '<div class="donate-card-bottom-line" translate="no">USDT Tether → TRON (TRC20)</div>' +
          '</div>' +

  function initDonateModule() {
    if (el.donateCardBox) {
      el.donateCardBox.addEventListener('click', (e) => e.stopPropagation());
      el.donateCardBox.addEventListener('touchend', (e) => e.stopPropagation(), { passive: false });
    }
    if (el.donateOverlay) {
      const dismiss = (e) => {
        if (e.target !== el.donateOverlay) return;
        e.preventDefault();
        e.stopPropagation();
        closeDonateOverlay();
      };
      el.donateOverlay.addEventListener('click', dismiss);
      el.donateOverlay.addEventListener('touchend', dismiss, { passive: false });
    }
  }

  function initDonateCardCopy() {
    const stack = document.getElementById('donate-card-stack');
    if (!stack) return;
    const card = stack.querySelector('.donate-card');
    if (!card) return;

    let lastCopyTs = 0;
    const COPY_COOLDOWN = 400;

    stack.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastCopyTs < COPY_COOLDOWN) return;
      lastCopyTs = now;
      const copyEl = stack.querySelector('.donate-copy-text');
      const text = (copyEl && (copyEl.getAttribute('data-copy-value') || copyEl.textContent.trim())) || getWallet();
      copyDonateText(text, card);
    });

    function showCopied(cardEl) {
      if (!cardEl) return;
      const hint = cardEl.querySelector('.donate-card-copied');
      if (!hint) return;
      hint.classList.add('visible');
      clearTimeout(hint._timer);
      hint._timer = setTimeout(() => hint.classList.remove('visible'), 1200);
    }

    function flashWallet(cardEl) {
      if (!cardEl) return;
      const copyEl = cardEl.querySelector('.donate-copy-text');
      if (!copyEl) return;
      copyEl.classList.add('flash-gold');
      clearTimeout(copyEl._flashTimer);
      copyEl._flashTimer = setTimeout(() => copyEl.classList.remove('flash-gold'), 700);
    }

    function copyDonateText(text, cardEl) {
      if (!text || !cardEl) return;
      let succeeded = false;
      window.__ppAllowDonateCopy = true;
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.left = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        succeeded = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (err) { succeeded = false; }
      window.__ppAllowDonateCopy = false;
      if (succeeded) { showCopied(cardEl); flashWallet(cardEl); return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => { showCopied(cardEl); flashWallet(cardEl); }).catch(() => {});
        }
      } catch (err) {}
    }
  }

  function openDonateOverlay(isRestartFlow) {
    if (!el.donateOverlay) return;
    session.donatePaused = true;
    session.pendingRestartAfterDonate = !!isRestartFlow;
    if (inHistoryMode()) {
      if (session.replay.active && !session.replay.paused) {
        pauseReplay();
        session.replay.pausedByWindow = true;
      }
    } else {
      pauseGame();
    }
    el.donateCardContent.innerHTML = buildDonateHtml();
    el.donateOverlay.classList.add('visible');
    initDonateCardCopy();
  }

  function closeDonateOverlay() {
    if (!el.donateOverlay) return;
    el.donateOverlay.classList.remove('visible');
    if (!session.donatePaused) return;
    session.donatePaused = false;

    const wasRestartFlow = session.pendingRestartAfterDonate;
    session.pendingRestartAfterDonate = false;

    if (wasRestartFlow) {
      restartSession();
      return;
    }

    if (!inHistoryMode()) resumeGame();
    else if (session.replay.active && session.replay.pausedByWindow) {
      session.replay.pausedByWindow = false;
      resumeReplay();
    }
  }

})();
</script>
</body>
</html>
